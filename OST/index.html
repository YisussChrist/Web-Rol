<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soundtracks de Pelea</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #080a12;
            --bg-soft: #10131f;
            --panel: rgba(18, 21, 34, 0.72);
            --panel-strong: rgba(21, 25, 40, 0.88);
            --card: rgba(255, 255, 255, 0.075);
            --card-hover: rgba(255, 255, 255, 0.105);
            --line: rgba(255, 255, 255, 0.09);
            --line-strong: rgba(255, 255, 255, 0.16);
            --text: #f5f7ff;
            --muted: #9aa4bb;
            --muted-2: #717b92;
            --primary: #8bd3ff;
            --accent: #ff8fb7;
            --gold: #ffd983;
            --danger: #ff6b8a;
            --success: #8fffc3;
            --radius-xl: 34px;
            --radius-lg: 24px;
            --radius-md: 18px;
            --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            --shadow-soft: 0 16px 45px rgba(0, 0, 0, 0.22);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 0%, rgba(139, 211, 255, 0.16), transparent 34%),
                radial-gradient(circle at 86% 16%, rgba(255, 143, 183, 0.13), transparent 28%),
                linear-gradient(145deg, #080a12 0%, #10131f 48%, #0b0d17 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(to bottom, rgba(255,255,255,0.035), transparent 38%),
                radial-gradient(circle at 50% 110%, rgba(139,211,255,0.08), transparent 36%);
            z-index: 0;
        }

        body.battle-mode-active {
            background:
                radial-gradient(circle at 16% 12%, rgba(139, 211, 255, 0.20), transparent 34%),
                radial-gradient(circle at 82% 18%, rgba(255, 143, 183, 0.18), transparent 30%),
                linear-gradient(145deg, #080a12 0%, #111524 48%, #090b13 100%);
        }

        button, input, select { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }

        .sidebar {
            width: 292px;
            height: 100vh;
            position: sticky;
            top: 0;
            z-index: 5;
            flex-shrink: 0;
            overflow-y: auto;
            padding: 22px 16px;
            background: rgba(8, 10, 18, 0.64);
            border-right: 1px solid var(--line);
            backdrop-filter: blur(22px);
        }

        .sidebar h3 {
            margin: 4px 8px 16px;
            color: var(--text);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0.82;
        }

        .sidebar-tools { display: grid; gap: 10px; margin-bottom: 18px; }

        .search-input, .select-input, .intensity-select {
            width: 100%;
            color: var(--text);
            background: rgba(255,255,255,0.075);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 11px 14px;
            outline: none;
            transition: border-color .22s ease, background .22s ease, box-shadow .22s ease;
        }

        .search-input::placeholder { color: var(--muted-2); }
        .search-input:focus, .select-input:focus, .intensity-select:focus {
            border-color: rgba(139,211,255,0.55);
            background: rgba(255,255,255,0.105);
            box-shadow: 0 0 0 4px rgba(139,211,255,0.08);
        }
        .select-input option, .intensity-select option { color: #151826; background: #f7f8ff; }

        .tool-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .mini-btn, .pill-btn {
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.075);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 14px;
            cursor: pointer;
            transition: transform .2s ease, background .2s ease, border-color .2s ease, color .2s ease;
            font-weight: 700;
            box-shadow: none;
        }

        .mini-btn:hover, .mini-btn.active, .pill-btn:hover, .pill-btn.active {
            transform: translateY(-1px);
            background: rgba(139,211,255,0.14);
            border-color: rgba(139,211,255,0.38);
            color: #ffffff;
        }

        .char-list { display: grid; gap: 8px; }

        .char-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background .22s ease, transform .22s ease, border-color .22s ease;
        }

        .char-item:hover, .char-item.active {
            background: rgba(255,255,255,0.08);
            border-color: var(--line);
            transform: translateX(2px);
        }

        .char-item img {
            width: 44px;
            height: 44px;
            border-radius: 15px;
            object-fit: cover;
            border: 1px solid var(--line);
        }

        .char-item span { font-weight: 750; font-size: .93rem; }
        .char-item small { display: block; margin-top: 3px; color: var(--muted); font-size: .72rem; }

        .main-content {
            position: relative;
            z-index: 1;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 252px;
        }

        header {
            max-width: 980px;
            margin: 0 auto;
            padding: 56px 22px 20px;
            text-align: left;
        }

        h1 {
            max-width: 880px;
            font-size: clamp(2.35rem, 7vw, 5.2rem);
            line-height: .92;
            letter-spacing: -0.07em;
            font-weight: 850;
            color: #fff;
        }

        .subtitle {
            margin-top: 18px;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.2rem);
            letter-spacing: -0.015em;
        }

        .top-actions {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 22px 24px;
        }

        .top-actions .select-input { width: auto; min-width: 220px; }

        .featured, .soundtrack-list, .battle-zone {
            max-width: 980px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 22px;
        }
        .featured { margin-bottom: 18px; }
        .soundtrack-list { display: flex; flex-direction: column; gap: 16px; }

        .soundtrack-card {
            position: relative;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-soft);
            transition: transform .25s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
        }

        .soundtrack-card:hover {
            transform: translateY(-4px);
            background: var(--card-hover);
            border-color: var(--line-strong);
            box-shadow: var(--shadow);
        }

        .soundtrack-card.playing {
            border-color: rgba(139,211,255,0.42);
            box-shadow: 0 22px 70px rgba(139,211,255,0.14), var(--shadow-soft);
        }

        .soundtrack-card.playing::after {
            content: "NOW PLAYING";
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: .65rem;
            letter-spacing: .12em;
            color: #09111d;
            background: linear-gradient(135deg, var(--primary), #e9f7ff);
            padding: 7px 10px;
            border-radius: 999px;
            font-weight: 900;
        }

        .card-content {
            padding: 22px;
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 20px;
            align-items: center;
        }

        .character-face, .character-group-left img, .track-row img, .battle-fighter img, .player-top img {
            object-fit: cover;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.05);
        }

        .character-face {
            width: 130px;
            height: 130px;
            border-radius: 28px;
            box-shadow: none;
        }

        .track-meta {
            color: var(--primary);
            font-weight: 800;
            font-size: .74rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .track-desc {
            color: var(--muted);
            line-height: 1.55;
            margin: 8px 0 12px;
        }

        .actions-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .play-btn, .icon-btn, .control-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            cursor: pointer;
            transition: transform .2s ease, background .2s ease, opacity .2s ease;
        }

        .play-btn {
            width: 48px;
            height: 48px;
            border-radius: 18px;
            color: #08111d;
            background: linear-gradient(135deg, #dff4ff, var(--primary));
            font-size: 1.25rem;
            font-weight: 900;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 17px;
            color: #fff;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--line);
            font-size: 1rem;
        }

        .play-btn:hover, .icon-btn:hover, .control-btn:hover { transform: translateY(-2px) scale(1.02); }
        .icon-btn.fav.active { color: var(--gold); background: rgba(255,217,131,0.12); border-color: rgba(255,217,131,0.34); }

        .soundtrack-card.playing .character-face, .player-cover.playing { animation: softPulse 1.2s infinite alternate; }
        @keyframes softPulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.015); filter: brightness(1.08); }
        }

        .character-group {
            display: grid;
            grid-template-columns: minmax(220px, 285px) 1fr;
            gap: 18px;
            align-items: start;
            padding: 18px;
        }

        .character-group-left { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
        .character-group-left img { width: 86px; height: 86px; border-radius: 24px; flex-shrink: 0; }
        .character-group-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .character-group-info h2 { font-size: 1.35rem; letter-spacing: -0.035em; }
        .character-group-right, .track-list { display: grid; gap: 10px; }
        .character-group.playing-character { border-color: rgba(139,211,255,0.34); }

        .character-group-header { display: none; }
        .tracks-inside { display: grid; gap: 12px; }

        .track-row {
            display: grid;
            grid-template-columns: 68px 1fr auto;
            gap: 14px;
            align-items: center;
            padding: 10px;
            border-radius: 24px;
            background: rgba(255,255,255,0.052);
            border: 1px solid rgba(255,255,255,0.07);
            transition: background .2s ease, border-color .2s ease, transform .2s ease;
        }

        .track-row:hover { background: rgba(255,255,255,0.082); border-color: var(--line-strong); transform: translateY(-1px); }
        .track-row.playing-row { border-color: rgba(139,211,255,0.42); background: rgba(139,211,255,0.10); }
        .track-row img { width: 68px; height: 68px; border-radius: 20px; }
        .track-row h3 { font-size: 1.02rem; letter-spacing: -0.025em; }

        .track-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .tag {
            font-size: .62rem;
            color: #dfe7f8;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 5px 8px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 750;
        }

        .battle-zone { display: none; margin-top: 8px; margin-bottom: 22px; }
        .battle-zone.show { display: block; }
        .battle-card {
            border-radius: var(--radius-xl);
            padding: 20px;
            border: 1px solid var(--line);
            background: linear-gradient(135deg, rgba(139,211,255,.10), rgba(255,143,183,.08)), var(--panel);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-soft);
        }
        .battle-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }
        .battle-fighter { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; min-width: 0; }
        .battle-fighter img { width: 76px; height: 76px; border-radius: 22px; }
        .vs { font-size: 1.5rem; font-weight: 900; color: #fff; opacity: .9; }

        .lore-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(4, 6, 12, 0.72);
            backdrop-filter: blur(10px);
        }
        .lore-modal.show { display: flex; }
        .lore-box {
            width: min(720px, 100%);
            padding: 26px;
            border-radius: 32px;
            background: rgba(18,21,34,.96);
            border: 1px solid var(--line-strong);
            box-shadow: var(--shadow);
        }
        .lore-box h2 { color: #fff; margin-bottom: 10px; letter-spacing: -0.04em; }
        .lore-box p { color: var(--muted); line-height: 1.68; }

        .global-player {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: none;
            flex-direction: column;
            gap: 9px;
            padding: 12px 14px 14px;
            background: rgba(8, 10, 18, 0.82);
            border-top: 1px solid var(--line);
            backdrop-filter: blur(24px);
            box-shadow: 0 -22px 70px rgba(0,0,0,0.34);
        }
        .global-player.show { display: flex; }
        .player-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .player-top img { width: 54px; height: 54px; border-radius: 18px; }
        .player-info { min-width: 0; flex: 1; }
        #playerTitle { font-weight: 850; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; }
        #playerCharacter { color: var(--primary); font-size: .86rem; margin-top: 2px; }
        #playerMode { color: var(--gold); font-size: .72rem; font-weight: 800; margin-top: 2px; letter-spacing: .08em; }

        .cover-action {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.075);
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform .2s ease, background .2s ease, border-color .2s ease;
        }

        .cover-action:hover {
            transform: translateY(-2px) scale(1.02);
            background: rgba(139,211,255,.13);
            border-color: rgba(139,211,255,.38);
        }

        canvas#visualizer {
            width: 100%;
            height: 48px;
            border-radius: 18px;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .cover-modal {
            position: fixed;
            inset: 0;
            z-index: 2200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(4, 6, 12, 0.74);
            backdrop-filter: blur(14px);
        }

        .cover-modal.show { display: flex; }

        .cover-modal-box {
            position: relative;
            width: min(520px, 94vw);
            padding: 18px;
            border-radius: 34px;
            background: rgba(18,21,34,.96);
            border: 1px solid var(--line-strong);
            box-shadow: var(--shadow);
        }

        .cover-modal-box img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 26px;
            border: 1px solid rgba(255,255,255,.16);
            display: block;
            background: rgba(255,255,255,.05);
        }

        .cover-modal-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-top: 14px;
        }

        .cover-modal-info h3 {
            font-size: 1.05rem;
            letter-spacing: -0.025em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cover-modal-info p {
            color: var(--primary);
            font-size: .86rem;
            margin-top: 3px;
        }

        .progress-container { display: flex; flex-direction: column; gap: 4px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.12); border-radius: 999px; position: relative; cursor: pointer; overflow: hidden; }
        .progress { height: 100%; background: linear-gradient(to right, var(--primary), var(--accent)); border-radius: 999px; width: 0%; }
        .time { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted-2); margin-top: 2px; }

        .player-bottom-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
        .player-controls, .controls { display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; }
        .player-volume, .volume-container { display: flex; align-items: center; gap: 10px; justify-content: flex-end; flex: 1; min-width: 220px; }
        .control-btn { width: 40px; height: 40px; border-radius: 15px; background: rgba(255,255,255,.075); color: #fff; border: 1px solid var(--line); font-size: 1rem; }
        .control-btn:hover, .control-btn.active { background: rgba(139,211,255,.13); color: var(--primary); }
        .control-btn.big { width: 50px; height: 50px; border-radius: 18px; font-size: 1.35rem; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #08111d; border: 0; }
        .volume-slider { width: min(220px, 45vw); accent-color: var(--primary); }

        .queue-panel { display: none; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.07); }
        .queue-panel.open { display: flex; max-height: min(42vh, 360px); overflow-y: auto; padding-right: 4px; }
        .queue-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--primary); font-weight: 800; font-size: .9rem; }
        .queue-close-btn { width: 34px; height: 34px; border-radius: 13px; }
        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,.052);
            border: 1px solid rgba(255,255,255,.07);
        }
        .queue-item span, .queue-item strong { color: #fff; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .queue-item small, .queue-item p { color: var(--muted); font-size: .78rem; }

        .global-player.minimized { padding: 8px 10px 10px; gap: 6px; }
        .global-player.minimized .player-top { gap: 8px; }
        .global-player.minimized .player-top img { width: 44px; height: 44px; }
        .global-player.minimized #playerTitle { font-size: .95rem; }
        .global-player.minimized #playerCharacter,
        .global-player.minimized #playerMode { font-size: .76rem; }
        .global-player.minimized canvas#visualizer,
        .global-player.minimized .progress-container,
        .global-player.minimized .player-bottom-row,
        .global-player.minimized .volume-container { display: none; }
        .global-player.minimized .controls { justify-content: center; }
        .global-player.minimized .controls .control-btn:not(.big) { display: none; }
        .global-player.minimized .control-btn.big { width: 48px; height: 48px; font-size: 1.35rem; }
        .global-player.audio-only canvas#visualizer,
        .global-player.audio-only .player-top img,
        .global-player.audio-only .queue-panel { display: none; }

        @media (min-width: 901px) {
            .sidebar { display: block; }
            .global-player { left: 292px; }
        }

        @media (max-width: 900px) {
            body { display: block; }
            .sidebar { display: none; }
            header { padding-top: 38px; }
            .top-actions .select-input { width: 100%; }
            .main-content { padding-bottom: 272px; }
            .global-player { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
            .card-content { grid-template-columns: 96px 1fr !important; gap: 14px !important; }
            .character-face { width: 96px !important; height: 112px !important; border-radius: 24px; }
            .character-group { grid-template-columns: 1fr; padding: 14px; }
            .character-group-left { align-items: center; }
            .character-group-left img { width: 76px; height: 76px; border-radius: 22px; }
            .track-row { grid-template-columns: 62px 1fr; }
            .track-row img { width: 62px; height: 62px; }
            .track-row .actions-row { grid-column: 1 / -1; justify-content: flex-start; }
            .battle-grid { grid-template-columns: 1fr; text-align: center; }
            .battle-fighter { grid-template-columns: 70px 1fr; text-align: left; }
            .player-top img { width: 46px; height: 46px; }
            canvas#visualizer { height: 42px; }
            .cover-action { width: 38px; height: 38px; border-radius: 14px; }
            .control-btn { width: 36px; height: 36px; font-size: .95rem; border-radius: 14px; }
            .control-btn.big { width: 46px; height: 46px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h3>PERSONAJES</h3>
        <div class="sidebar-tools">
            <input class="search-input" id="searchInput" placeholder="Buscar canción o personaje...">
            <select class="select-input" id="filterSelect">
                <option value="all">Todas las canciones</option>
                <option value="favorites">⭐ Favoritos</option>
                <option value="rage">Rage Mode</option>
                <option value="finalboss">Final Boss</option>
                <option value="emotional">Emotional</option>
                <option value="normalbattle">Normal Battle</option>
                <option value="dance">Dance</option>
                <option value="SeriousBattle">Serious Battle</option>
                <option value="DarkVictorian">Dark Victorian</option>
            </select>
            <div class="tool-row">
                <button class="mini-btn" id="shuffleTopBtn">🔀 Shuffle</button>
                <button class="mini-btn" id="battleTopBtn">⚔️ Battle</button>
            </div>
        </div>
        <div class="char-list" id="sidebarChars"></div>
    </aside>

    <div class="main-content">
        <header>
            <h1>SOUNDTRACKS DE PELEA</h1>
            <p class="subtitle">La banda sonora de tus batallas favoritas</p>
        </header>

        <div class="top-actions">
            <button class="pill-btn" id="showAllBtn">🎧 Biblioteca</button>
            <button class="pill-btn" id="showFavBtn">⭐ Favoritos</button>

        const searchInput = document.getElementById('searchInput');
        const filterSelect = document.getElementById('filterSelect');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const shuffleTopBtn = document.getElementById('shuffleTopBtn');
        const battleTopBtn = document.getElementById('battleTopBtn');
        const toggleMiniBtn = document.getElementById('toggleMiniBtn');
        const toggleAudioOnlyBtn = document.getElementById('toggleAudioOnlyBtn');
        const toggleQueueBtn = document.getElementById('toggleQueueBtn');
        const characterSelect = document.getElementById('characterSelect');
        const battleZone = document.getElementById('battleZone');
        const queuePanel = document.getElementById('queuePanel');
        const intensitySelect = document.getElementById('intensitySelect');
        let miniPlayer = JSON.parse(localStorage.getItem('miniPlayer') || 'false');
        let audioOnly = JSON.parse(localStorage.getItem('audioOnly') || 'false');
        let queueOpen = JSON.parse(localStorage.getItem('queueOpen') || 'false');

        function initVisualizer() {
            const rect = canvasEl.getBoundingClientRect();
            canvasEl.width = Math.max(800, Math.floor(rect.width || 800));
            canvasEl.height = 76;
        }

        function drawVisualizer() {
            if (!analyser) return;
            animationId = requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);
            const ctx = canvasEl.getContext('2d');
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

            const multiplier = intensity === 'finalboss' ? 1.25 : intensity === 'rage' ? 1.05 : 0.85;
            const barWidth = (canvasEl.width / dataArray.length) * (intensity === 'finalboss' ? 2.2 : 1.8);

            for (let i = 0; i < dataArray.length; i++) {
                const value = dataArray[i] * multiplier;
                const barHeight = Math.min((value / 255) * canvasEl.height * 0.9, canvasEl.height);
                const hueBase = intensity === 'finalboss' ? 315 : intensity === 'rage' ? 350 : 180;
                const hue = hueBase + (i / dataArray.length) * 85;
                ctx.fillStyle = `hsla(${hue}, 100%, 65%, .86)`;
                ctx.fillRect(i * barWidth, canvasEl.height - barHeight, barWidth - 3, barHeight);
            }
        }

        function setupAudioContext() {
            if (audioContext) {
                if (audioContext.state === 'suspended') audioContext.resume();
                return;
            }
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 128;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            source = audioContext.createMediaElementSource(audioPlayer);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            drawVisualizer();
        }

        function formatTime(seconds) {
            if (!Number.isFinite(seconds)) return '0:00';
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function updateProgress() {
            if (!audioPlayer.duration) return;
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progress.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            localStorage.setItem('time', audioPlayer.currentTime);
            localStorage.setItem('track', currentIndex);
        }

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (audioPlayer.duration) audioPlayer.currentTime = pos * audioPlayer.duration;
        });

        function dynamicBackground(track) {
            document.body.style.background = `
                radial-gradient(circle at top left, rgba(0,245,255,0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(255,42,109,0.18), transparent 35%),
                linear-gradient(rgba(11,14,26,0.88), rgba(11,14,26,0.96)),
                url('${track.songCover}') center/cover fixed`;
        }

        function loadTrack(index, keepTime = false) {
            const track = soundtracks[index];
            currentIndex = index;
            playerCover.src = track.songCover;
            expandedCover.src = track.songCover;
            expandedCoverTitle.textContent = track.songTitle;
            expandedCoverCharacter.textContent = track.character;
            playerTitle.textContent = track.songTitle;
            playerCharacter.textContent = track.character;
            playerMode.textContent = battleMode ? 'BATTLE MODE ACTIVO' : `INTENSIDAD: ${intensity.toUpperCase()}`;
            audioPlayer.src = track.audio;
            audioPlayer.volume = Number(volumeSlider.value);
            globalPlayer.classList.add('show');
            dynamicBackground(track);
            renderAll();
            localStorage.setItem('track', currentIndex);

            if (keepTime) {
                audioPlayer.addEventListener('loadedmetadata', function restore() {
                    audioPlayer.currentTime = Number(localStorage.getItem('time')) || 0;
                    audioPlayer.removeEventListener('loadedmetadata', restore);
                });
            }
        }

        async function togglePlay() {
            if (!audioPlayer.src) loadTrack(currentIndex);

            if (isPlaying) {
                audioPlayer.pause();
                playPauseBtn.textContent = '▶';
                playerCover.classList.remove('playing');
                isPlaying = false;
            } else {
                setupAudioContext();
                try {
                    await audioPlayer.play();
                    playPauseBtn.textContent = '❚❚';
                    playerCover.classList.add('playing');
                    isPlaying = true;
                } catch (err) {
                    alert('No se pudo reproducir el audio. Revisa que el archivo exista en la ruta indicada.');
                }
            }
            renderAll();
        }

        function getNextIndex() {
            if (battleMode) return currentIndex === battlePair[0] ? battlePair[1] : battlePair[0];
            if (shuffle) {
                let next;
                do { next = Math.floor(Math.random() * soundtracks.length); } while (next === currentIndex && soundtracks.length > 1);
                return next;
            }
            return (currentIndex + 1) % soundtracks.length;
        }

        function nextTrack() {
            if (repeat && !battleMode) {
                audioPlayer.currentTime = 0;
                if (isPlaying) audioPlayer.play();
                return;
            }
            currentIndex = getNextIndex();
            loadTrack(currentIndex);
            if (isPlaying) audioPlayer.play();
        }

        function prevTrack() {
            currentIndex = battleMode
                ? (currentIndex === battlePair[0] ? battlePair[1] : battlePair[0])
                : (currentIndex - 1 + soundtracks.length) % soundtracks.length;
            loadTrack(currentIndex);
            if (isPlaying) audioPlayer.play();
        }

        function fadeOutAndNext() {
            const originalVolume = Number(volumeSlider.value);
            const step = Math.max(originalVolume / 20, 0.02);
            const fade = setInterval(() => {
                if (audioPlayer.volume > step) audioPlayer.volume = Math.max(0, audioPlayer.volume - step);
                else {
                    clearInterval(fade);
                    nextTrack();
                    audioPlayer.volume = originalVolume;
                }
            }, 70);
        }

        window.playSpecific = async function(index) {
            const playableIndex = getPlayableIndex(index);
            loadTrack(playableIndex);
            setupAudioContext();
            try {
                await audioPlayer.play();
                isPlaying = true;
                playPauseBtn.textContent = '❚❚';
                playerCover.classList.add('playing');
                renderAll();
            } catch (err) {
                alert('No se pudo reproducir el audio. Revisa que el archivo exista en la ruta indicada.');
            }
        };

        function toggleFavorite(index) {
            if (favorites.includes(index)) favorites = favorites.filter(i => i !== index);
            else favorites.push(index);
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderAll();
        }

        function showLore(index) {
            document.getElementById('loreTitle').textContent = soundtracks[index].songTitle;
            document.getElementById('loreText').textContent = soundtracks[index].lore || soundtracks[index].characterLore;
            document.getElementById('loreModal').classList.add('show');
        }

        function closeLore() { document.getElementById('loreModal').classList.remove('show'); }
        window.closeLore = closeLore;

        function openCoverModal() {
            const track = soundtracks[currentIndex] || soundtracks[0];
            expandedCover.src = track.songCover;
            expandedCoverTitle.textContent = track.songTitle;
            expandedCoverCharacter.textContent = track.character;
            coverModal.classList.add('show');
        }

        function closeCoverModal(event) {
            if (event && !event.target.classList.contains('cover-modal')) return;
            coverModal.classList.remove('show');
        }

        window.closeCoverModal = closeCoverModal;

        function matchesFilters(track, index) {
            const q = searchInput.value.trim().toLowerCase();
            const filter = filterSelect.value;
            const selectedCharacter = characterSelect?.value || 'all';
            const normalizedTags = (track.tags || []).map(tag => String(tag).toLowerCase().replace(/\s+/g, ''));
            const normalizedFilter = String(filter).toLowerCase().replace(/\s+/g, '');
            const text = `${track.character} ${track.songTitle} ${track.songDescription} ${(track.tags || []).join(' ')}`.toLowerCase();
            const qOk = !q || text.includes(q);
            const characterOk = selectedCharacter === 'all' || track.character === selectedCharacter;
            const filterOk = filter === 'all'
                || (filter === 'favorites' && favorites.includes(index))
                || normalizedTags.includes(normalizedFilter);
            return qOk && filterOk && characterOk;
        }

        function characterHasVisibleTrack(characterIndex) {
            return soundtracks.some((track, index) => track.characterIndex === characterIndex && matchesFilters(track, index));
        }

        function renderSidebar() {
            sidebar.innerHTML = '';
            characters.forEach((char, charIndex) => {
                if (!characterHasVisibleTrack(charIndex)) return;
                const firstVisibleTrackIndex = soundtracks.findIndex((track, index) =>
                    track.characterIndex === charIndex && matchesFilters(track, index)
                );
                const totalTracks = char.tracks.length;
                const div = document.createElement('div');
                div.className = `char-item ${soundtracks[currentIndex]?.characterIndex === charIndex ? 'active' : ''}`;
                div.innerHTML = `<img src="${char.characterFace}" alt=""> <div><span>${char.character}</span><small>${totalTracks} canción${totalTracks !== 1 ? 'es' : ''}</small></div>`;
                div.onclick = () => playSpecific(firstVisibleTrackIndex);
                sidebar.appendChild(div);
            });
        }

        function renderFeatured() {
            const track = soundtracks[currentIndex] || soundtracks[0];
            featured.innerHTML = `
                <div class="soundtrack-card ${isPlaying ? 'playing' : ''}" style="padding: 20px;">
                    <div class="card-content" style="grid-template-columns: minmax(110px, 180px) 1fr; gap: 30px;">
                        <img class="character-face" src="${track.characterFace}" style="width:100%;height:180px;">
                        <div>
                            <div class="track-meta">DESTACADO · ${track.character}</div>
                            <h2 style="font-size:clamp(1.7rem, 4vw, 2.4rem);">${track.songTitle}</h2>
                            <p class="track-desc" style="font-size:1.08rem;">${track.songDescription}</p>
                            <div class="actions-row">
                                <button class="play-btn" onclick="playSpecific(${currentIndex})">▶</button>
                                <button class="icon-btn fav ${favorites.includes(currentIndex) ? 'active' : ''}" onclick="toggleFavorite(${currentIndex})">⭐</button>
                                <button class="icon-btn" onclick="showLore(${currentIndex})">📖</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function tagHTML(tags) {
            return (tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');
        }

        function populateCharacterSelect() {
            const uniqueCharacters = [...new Set(soundtracks.map(track => track.character))];
            characterSelect.innerHTML = '<option value="all">Todos los personajes</option>' +
                uniqueCharacters.map(name => `<option value="${name}">${name}</option>`).join('');
        }

        function getQueueTracks() {
            return soundtracks.slice(currentIndex + 1).concat(soundtracks.slice(0, currentIndex + 1));
        }

        function renderQueue() {
            const queueTracks = getQueueTracks();
            const currentTrack = soundtracks[currentIndex];
            const itemsHTML = queueTracks.map((track) => {
                const realIndex = soundtracks.findIndex(item =>
                    item.characterIndex === track.characterIndex && item.trackIndex === track.trackIndex
                );
                const isCurrent = currentTrack && realIndex === currentIndex;
                return `
                    <div class="queue-item ${isCurrent ? 'playing-row' : ''}">
                        <div>
                            <strong>${isCurrent ? '▶ ' : ''}${track.songTitle}</strong>
                            <p>${track.character}</p>
                        </div>
                        <button class="icon-btn" onclick="playSpecific(${realIndex})">▶</button>
                    </div>
                `;
            }).join('');

            queuePanel.innerHTML = `
                <div class="queue-header">
                    <span>Cola de reproducción · ${queueTracks.length} pista${queueTracks.length !== 1 ? 's' : ''}</span>
                    <button class="icon-btn queue-close-btn" onclick="closeQueuePanel()" title="Cerrar cola">✕</button>
                </div>
                ${itemsHTML || '<div class="queue-item">No hay pistas en la cola</div>'}
            `;

            queuePanel.classList.toggle('open', queueOpen);
        }

        function closeQueuePanel() {
            queueOpen = false;
            localStorage.setItem('queueOpen', JSON.stringify(queueOpen));
            renderAll();
        }
        window.closeQueuePanel = closeQueuePanel;

        function toggleAudioOnly() {
            audioOnly = !audioOnly;
            localStorage.setItem('audioOnly', JSON.stringify(audioOnly));
            if (audioOnly) {
                globalPlayer.classList.add('audio-only');
                toggleAudioOnlyBtn.textContent = '🎧 Visualizador off';
            } else {
                globalPlayer.classList.remove('audio-only');
                toggleAudioOnlyBtn.textContent = '🎧 Solo audio';
            }
        }

        function toggleQueuePanel() {
            queueOpen = !queueOpen;
            localStorage.setItem('queueOpen', JSON.stringify(queueOpen));
            queuePanel.classList.toggle('open', queueOpen);
            toggleQueueBtn.textContent = queueOpen ? '📜 Ocultar cola' : '📜 Cola';
        }

        function normalizeQueueIndex(value) {
            const characterIndex = Math.floor(value / 1000);
            const trackIndex = value % 1000;
            return soundtracks.findIndex(track => track.characterIndex === characterIndex && track.trackIndex === trackIndex);
        }

        function resolveQueuePlay(value) {
            const index = Number(value);
            if (index >= 1000) return normalizeQueueIndex(index);
            return index;
        }

        function getPlayableIndex(value) {
            return resolveQueuePlay(value);
        }

        function renderList() {
            list.innerHTML = '';
            characters.forEach((char, charIndex) => {
                const visibleTracks = soundtracks
                    .map((track, index) => ({ track, index }))
                    .filter(item => item.track.characterIndex === charIndex && matchesFilters(item.track, item.index));

                if (visibleTracks.length === 0) return;

                const group = document.createElement("article");
                const isCurrentCharacter = soundtracks[currentIndex]?.characterIndex === charIndex;
                group.className = `soundtrack-card character-group ${isCurrentCharacter ? 'playing-character' : ''}`;

                group.innerHTML = `
                    <div class="character-group-left">
                        <img src="${char.characterFace}" alt="${char.character}">
                        <div class="character-group-info">
                            <div class="track-meta">PERSONAJE · ${visibleTracks.length}/${char.tracks.length} visibles</div>
                            <h2>${char.character}</h2>
                            <p class="track-desc">${char.lore}</p>
                        </div>
                    </div>
                    <div class="character-group-right">
                        <div class="track-list">
                            ${visibleTracks.map(({ track, index }) => `
                                <div class="track-row ${index === currentIndex && isPlaying ? 'playing-row' : ''}">
                                    <img src="${track.songCover}" alt="${track.songTitle}">
                                    <div>
                                        <h3>${track.songTitle}</h3>
                                        <p class="track-desc" style="margin:4px 0 0;">${track.songDescription}</p>
                                        <div class="track-tags">${tagHTML(track.tags)}</div>
                                    </div>
                                    <div class="actions-row">
                                        <button class="play-btn" onclick="playSpecific(${index})">▶</button>
                                        <button class="icon-btn fav ${favorites.includes(index) ? 'active' : ''}" onclick="toggleFavorite(${index})">⭐</button>
                                        <button class="icon-btn" onclick="showLore(${index})">📖</button>
                                        <button class="icon-btn" onclick="setBattleFighter(${index})">⚔️</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                list.appendChild(group);
            });
        }

        function renderBattleZone() {
            if (!battleMode) {
                battleZone.classList.remove('show');
                return;
            }
            const a = soundtracks[battlePair[0]];
            const b = soundtracks[battlePair[1]];
            battleZone.classList.add('show');
            battleZone.innerHTML = `
                <div class="battle-card">
                    <div class="battle-grid">
                        <div class="battle-fighter">
                            <img src="${a.characterFace}">
                            <div><div class="track-meta">${a.character}</div><h2>${a.songTitle}</h2></div>
                        </div>
                        <div class="vs">VS</div>
                        <div class="battle-fighter">
                            <img src="${b.characterFace}">
                            <div><div class="track-meta">${b.character}</div><h2>${b.songTitle}</h2></div>
                        </div>
                    </div>
                    <div class="top-actions" style="padding:18px 0 0;">
                        <button class="pill-btn" onclick="playSpecific(${battlePair[0]})">Reproducir A</button>
                        <button class="pill-btn" onclick="playSpecific(${battlePair[1]})">Reproducir B</button>
                        <button class="pill-btn" onclick="randomBattlePair()">Cambiar combate</button>
                    </div>
                </div>
            `;
        }

        function renderButtons() {
            shuffleBtn.classList.toggle('active', shuffle);
            repeatBtn.classList.toggle('active', repeat);
            shuffleTopBtn.classList.toggle('active', shuffle);
            battleTopBtn.classList.toggle('active', battleMode);
            document.getElementById('toggleBattleBtn').classList.toggle('active', battleMode);
            document.body.classList.toggle('battle-mode-active', battleMode);
            intensitySelect.value = intensity;
            toggleMiniBtn.classList.toggle('active', miniPlayer);
            toggleMiniBtn.textContent = miniPlayer ? '⬆️ Expandir' : '📉 Compacto';
            toggleAudioOnlyBtn.classList.toggle('active', audioOnly);
            toggleAudioOnlyBtn.textContent = audioOnly ? '🎧 Visualizador off' : '🎧 Solo audio';
            toggleQueueBtn.classList.toggle('active', queueOpen);
            toggleQueueBtn.textContent = queueOpen ? '📜 Ocultar cola' : '📜 Cola';
            globalPlayer.classList.toggle('minimized', miniPlayer);
            globalPlayer.classList.toggle('audio-only', audioOnly);
            queuePanel.classList.toggle('open', queueOpen);
            localStorage.setItem('shuffle', JSON.stringify(shuffle));
            localStorage.setItem('repeat', JSON.stringify(repeat));
            localStorage.setItem('intensity', intensity);
            localStorage.setItem('miniPlayer', JSON.stringify(miniPlayer));
            localStorage.setItem('audioOnly', JSON.stringify(audioOnly));
            localStorage.setItem('queueOpen', JSON.stringify(queueOpen));
        }

        function renderAll() {
            renderButtons();
            renderSidebar();
            renderFeatured();
            renderList();
            renderQueue();
            renderBattleZone();
        }

        window.toggleFavorite = toggleFavorite;
        window.showLore = showLore;

        function setBattleFighter(index) {
            battlePair = [currentIndex, index === currentIndex ? (index + 1) % soundtracks.length : index];
            battleMode = true;
            renderAll();
            battleZone.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        window.setBattleFighter = setBattleFighter;

        function randomBattlePair() {
            const a = Math.floor(Math.random() * soundtracks.length);
            let b;
            do { b = Math.floor(Math.random() * soundtracks.length); } while (b === a);
            battlePair = [a, b];
            renderAll();
        }
        window.randomBattlePair = randomBattlePair;

        shuffleBtn.onclick = shuffleTopBtn.onclick = () => { shuffle = !shuffle; renderAll(); };
        repeatBtn.onclick = () => { repeat = !repeat; renderAll(); };
        battleTopBtn.onclick = document.getElementById('toggleBattleBtn').onclick = () => {
            battleMode = !battleMode;
            if (battleMode) {
                battlePair = [currentIndex, (currentIndex + 1) % soundtracks.length];
                battleZone.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            renderAll();
        };

        document.getElementById('showFavBtn').onclick = () => { filterSelect.value = 'favorites'; renderAll(); };
        document.getElementById('showAllBtn').onclick = () => { filterSelect.value = 'all'; searchInput.value = ''; renderAll(); };
        toggleMiniBtn.onclick = () => { miniPlayer = !miniPlayer; renderAll(); };
        toggleAudioOnlyBtn.onclick = () => { toggleAudioOnly(); renderAll(); };
        toggleQueueBtn.onclick = () => { toggleQueuePanel(); renderAll(); };
        expandCoverBtn.onclick = openCoverModal;
        playerCover.onclick = openCoverModal;
        playerCover.style.cursor = 'zoom-in';
        characterSelect.addEventListener('change', renderAll);

        searchInput.addEventListener('input', renderAll);
        filterSelect.addEventListener('change', renderAll);

        intensitySelect.addEventListener('change', () => {
            intensity = intensitySelect.value;
            playerMode.textContent = `INTENSIDAD: ${intensity.toUpperCase()}`;
            renderButtons();
        });

        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audioPlayer.duration); });
        audioPlayer.addEventListener('ended', nextTrack);

        volumeSlider.addEventListener('input', () => {
            audioPlayer.volume = Number(volumeSlider.value);
            const icon = document.querySelector('.volume-icon');
            if (volumeSlider.value == 0) icon.textContent = '🔇';
            else if (volumeSlider.value < 0.4) icon.textContent = '🔈';
            else if (volumeSlider.value < 0.7) icon.textContent = '🔉';
            else icon.textContent = '🔊';
        });

        document.addEventListener('keydown', (e) => {
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.code === 'ArrowRight') nextTrack();
            if (e.code === 'ArrowLeft') prevTrack();
            if (e.key.toLowerCase() === 'f') toggleFavorite(currentIndex);
            if (e.key === 'Escape') {
                closeLore();
                closeCoverModal();
            }
        });

        window.addEventListener('resize', initVisualizer);

        initVisualizer();
        populateCharacterSelect();
        loadTrack(currentIndex, true);
        renderAll();
    </script>
</body>
</html>
