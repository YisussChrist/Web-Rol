<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resonance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --bg: #000000;
            --bg-soft: #121212;
            --panel: #181818;
            --panel-strong: #242424;
            --card: #181818;
            --card-hover: #282828;
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.16);
            --text: #ffffff;
            --muted: #b3b3b3;
            --muted-2: #7c7c7c;
            --primary: #1ed760;
            --accent: #1db954;
            --gold: #f9d94a;
            --danger: #ff4f64;
            --success: #1ed760;
            --radius-xl: 18px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.32);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #000;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(30, 215, 96, .10), transparent 34%),
                radial-gradient(circle at 80% -10%, rgba(30, 215, 96, .18), transparent 35%);
            opacity: .8;
        }

        body.battle-mode-active::before {
            background:
                linear-gradient(180deg, rgba(30, 215, 96, .16), transparent 34%),
                radial-gradient(circle at 86% 0%, rgba(255, 70, 100, .16), transparent 34%);
        }

        button, input, select { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }

        .sidebar {
            width: 300px;
            height: 100vh;
            position: sticky;
            top: 0;
            z-index: 5;
            flex-shrink: 0;
            overflow-y: auto;
            padding: 14px 10px 16px;
            background: #000;
            border-right: 8px solid #000;
        }

        .sidebar::before {
            content: "Soundtracks";
            display: flex;
            align-items: center;
            gap: 8px;
            height: 64px;
            margin: 0 0 10px;
            padding: 0 16px;
            border-radius: 12px;
            background: var(--bg-soft);
            color: #fff;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .sidebar::after {
            content: "●";
            position: absolute;
            top: 34px;
            left: 24px;
            color: var(--primary);
            font-size: .72rem;
            filter: drop-shadow(0 0 10px rgba(30,215,96,.7));
        }

        .sidebar h3 {
            margin: 0;
            padding: 18px 16px 10px;
            color: var(--muted);
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .11em;
            text-transform: uppercase;
            background: var(--bg-soft);
            border-radius: 12px 12px 0 0;
        }

        .sidebar-tools {
            display: grid;
            gap: 10px;
            margin-bottom: 8px;
            padding: 0 12px 14px;
            background: var(--bg-soft);
            border-radius: 0 0 12px 12px;
        }

        .search-input, .select-input, .intensity-select {
            width: 100%;
            color: var(--text);
            background: #242424;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 11px 14px;
            outline: none;
            transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
        }

        .search-input::placeholder { color: var(--muted-2); }
        .search-input:focus, .select-input:focus, .intensity-select:focus {
            background: #2a2a2a;
            border-color: #3d3d3d;
            box-shadow: 0 0 0 2px #fff;
        }
        .select-input option, .intensity-select option { color: #fff; background: #282828; }

        .tool-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .mini-btn, .pill-btn {
            border: 0;
            background: #242424;
            color: #fff;
            border-radius: 999px;
            padding: 10px 14px;
            cursor: pointer;
            transition: transform .18s ease, background .18s ease, color .18s ease;
            font-weight: 800;
        }

        .mini-btn:hover, .mini-btn.active, .pill-btn:hover, .pill-btn.active {
            transform: scale(1.03);
            background: #333;
            color: #fff;
        }

        .char-list {
            display: grid;
            gap: 2px;
            padding: 8px;
            background: var(--bg-soft);
            border-radius: 12px;
        }

        .char-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            border: 0;
            transition: background .18s ease, color .18s ease;
            color: var(--muted);
        }

        .char-item:hover, .char-item.active {
            background: #242424;
            color: #fff;
        }

        .char-item img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            border: 0;
            box-shadow: 0 6px 18px rgba(0,0,0,.35);
        }

        .char-item span { font-weight: 800; font-size: .94rem; }
        .char-item small { display: block; margin-top: 3px; color: var(--muted-2); font-size: .74rem; }

        .main-content {
            position: relative;
            z-index: 1;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 168px;
            margin: 8px 8px 8px 0;
            border-radius: 14px;
            background:
                linear-gradient(180deg, rgba(30,215,96,.16) 0%, rgba(18,18,18,.98) 235px),
                #121212;
        }

        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 52px 28px 18px;
            text-align: left;
        }

        h1 {
            max-width: 980px;
            font-size: clamp(2.6rem, 7vw, 5.6rem);
            line-height: .9;
            letter-spacing: -0.075em;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 8px 30px rgba(0,0,0,.4);
        }

        .subtitle {
            margin-top: 16px;
            color: #fff;
            font-size: clamp(.98rem, 2vw, 1.12rem);
            font-weight: 600;
            opacity: .86;
        }

        .top-actions {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 28px 24px;
        }

        .top-actions .select-input { width: auto; min-width: 230px; }
        .top-actions .pill-btn:first-child,
        #showFavBtn.active,
        #toggleBattleBtn.active,
        #toggleQueueBtn.active,
        #toggleMiniBtn.active,
        #toggleAudioOnlyBtn.active {
            background: #fff;
            color: #000;
        }

        .featured, .soundtrack-list, .battle-zone {
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 28px;
        }
        .featured { margin-bottom: 22px; }
        .soundtrack-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 18px;
            align-items: stretch;
        }

        .soundtrack-card {
            position: relative;
            overflow: hidden;
            background: var(--card);
            border: 0;
            border-radius: var(--radius-md);
            box-shadow: none;
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        }

        .soundtrack-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover);
            box-shadow: var(--shadow-soft);
        }

        .soundtrack-card.playing { background: #223126; }
        .soundtrack-card.playing::after,
        .track-card.playing-row::after {
            content: "NOW PLAYING";
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
            font-size: .56rem;
            letter-spacing: .08em;
            color: #000;
            background: var(--primary);
            padding: 6px 9px;
            border-radius: 999px;
            font-weight: 900;
            box-shadow: 0 8px 18px rgba(0,0,0,.35);
        }

        /* When the featured card is the playing item, hide large decorative pseudo-elements
           so they don't cover the UI; keep the small "NOW PLAYING" badge visible. */
        .featured-card.playing::before,
        .featured-card.playing::after {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Ensure the small NOW PLAYING pill is on top of other decorations */
        .soundtrack-card.playing::after { z-index: 999 !important; }

        /* Visible inline badge inside the featured card to clearly indicate Now Playing */
        .featured-card .now-playing-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: linear-gradient(90deg, #2f7bff, #ff3c9b);
            color: #fff;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 800;
            font-size: .78rem;
            letter-spacing: .06em;
            box-shadow: 0 12px 30px rgba(0,0,0,.35);
            z-index: 120 !important;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 900px) {
            .featured-card .now-playing-badge { top: 12px; left: 12px; font-size: .68rem; padding: 5px 8px; }
        }

        .card-content {
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            align-items: start;
        }

        .character-face, .character-group-left img, .track-row img, .track-card-cover, .track-card-avatar, .battle-fighter img, .player-top img {
            object-fit: cover;
            border: 0;
            background: #242424;
            box-shadow: 0 8px 24px rgba(0,0,0,.45);
        }

        .character-face {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
        }

        .track-meta {
            color: var(--muted);
            font-weight: 800;
            font-size: .68rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .track-desc {
            color: var(--muted);
            line-height: 1.38;
            margin: 7px 0 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .soundtrack-card h2, .soundtrack-card h3 { letter-spacing: -0.035em; }
        .actions-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .play-btn, .icon-btn, .control-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            cursor: pointer;
            transition: transform .18s ease, background .18s ease, opacity .18s ease;
        }

        .play-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            color: #000;
            background: var(--primary);
            font-size: 1.15rem;
            font-weight: 900;
            box-shadow: 0 8px 22px rgba(0,0,0,.38);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #fff;
            background: #2a2a2a;
            font-size: .95rem;
        }

        .play-btn:hover, .icon-btn:hover, .control-btn:hover { transform: scale(1.06); }
        .icon-btn.fav.active { color: #000; background: var(--gold); }

        .soundtrack-card.playing .character-face, .player-cover.playing { animation: softPulse 1.15s infinite alternate; }
        @keyframes softPulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.018); filter: brightness(1.08); }
        }

        .featured-card {
            padding: 20px;
            background:
                linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.02)),
                var(--card);
        }

        .featured-layout {
            display: grid;
            grid-template-columns: minmax(210px, 280px) 1fr;
            gap: 26px;
            align-items: center;
        }

        .featured-cover-wrap,
        .track-cover-wrap {
            position: relative;
            isolation: isolate;
        }

        .featured-cover,
        .track-card-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            display: block;
        }

        .featured-avatar,
        .track-card-avatar {
            position: absolute;
            left: 12px;
            bottom: 12px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 3px solid #121212;
            z-index: 2;
        }

        .featured-card .track-desc {
            -webkit-line-clamp: 3;
            font-size: 1.02rem;
            max-width: 680px;
        }

        .track-card {
            position: relative;
            min-height: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-card-info { min-width: 0; }
        .track-card h3 {
            font-size: 1.02rem;
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .track-card-character {
            margin-top: 4px;
            color: var(--muted);
            font-size: .84rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-card .actions-row {
            margin-top: auto;
            padding-top: 2px;
            justify-content: space-between;
        }

        .track-card .play-btn {
            position: absolute;
            right: 22px;
            bottom: 106px;
            opacity: 0;
            transform: translateY(8px) scale(.95);
        }

        .track-card:hover .play-btn,
        .track-card.playing-row .play-btn {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .track-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .tag {
            font-size: .55rem;
            color: #d7d7d7;
            background: #2a2a2a;
            border: 0;
            padding: 4px 7px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: .05em;
            font-weight: 850;
        }

        .character-group,
        .track-row { display: contents; }
        .battle-zone { display: none; margin-top: 8px; margin-bottom: 22px; }
        .battle-zone.show { display: block; }
        .battle-card {
            border-radius: 18px;
            padding: 20px;
            border: 0;
            background: linear-gradient(135deg, rgba(30,215,96,.20), rgba(255,255,255,.06)), #181818;
            box-shadow: var(--shadow-soft);
        }
        .battle-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }
        .battle-fighter { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; min-width: 0; }
        .battle-fighter img { width: 76px; height: 76px; border-radius: 8px; }
        .vs { font-size: 1.5rem; font-weight: 900; color: var(--primary); }

        .lore-modal, .cover-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(12px);
        }
        .lore-modal.show, .cover-modal.show { display: flex; }
        .lore-box, .cover-modal-box {
            width: min(720px, 100%);
            padding: 24px;
            border-radius: 18px;
            background: #181818;
            border: 1px solid var(--line-strong);
            box-shadow: var(--shadow);
        }
        .lore-box h2 { color: #fff; margin-bottom: 10px; letter-spacing: -0.04em; }
        .lore-box p { color: var(--muted); line-height: 1.68; }

        .cover-modal-box { width: min(520px, 94vw); padding: 16px; }
        .cover-modal-box img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            background: #242424;
        }
        .cover-modal-info { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 14px; }
        .cover-modal-info h3 { font-size: 1.05rem; letter-spacing: -0.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cover-modal-info p { color: var(--primary); font-size: .86rem; margin-top: 3px; }

        .global-player {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: none;
            grid-template-columns: minmax(230px, 1fr) minmax(330px, 1.4fr) minmax(230px, 1fr);
            grid-template-rows: auto auto;
            gap: 8px 18px;
            align-items: center;
            padding: 12px 16px;
            background: #181818;
            border-top: 1px solid #282828;
            box-shadow: 0 -18px 60px rgba(0,0,0,.55);
        }
        .global-player.show { display: grid; }
        .player-top { grid-column: 1; grid-row: 1 / 3; display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-width: 0; }
        .player-top img { width: 58px; height: 58px; border-radius: 6px; flex-shrink: 0; }
        .player-info { min-width: 0; flex: 1; }
        #playerTitle { font-weight: 850; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; }
        #playerCharacter { color: var(--muted); font-size: .84rem; margin-top: 2px; }
        #playerMode { color: var(--primary); font-size: .7rem; font-weight: 900; margin-top: 2px; letter-spacing: .08em; }

        .cover-action {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 0;
            background: #2a2a2a;
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform .18s ease, background .18s ease;
        }
        .cover-action:hover { transform: scale(1.06); background: #3a3a3a; }

        canvas#visualizer {
            grid-column: 2;
            grid-row: 2;
            width: 100%;
            height: 34px;
            border-radius: 999px;
            background: #101010;
            border: 0;
        }

        .progress-container { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 5px; align-self: end; }
        .progress-bar { width: 100%; height: 5px; background: #4d4d4d; border-radius: 999px; position: relative; cursor: pointer; overflow: hidden; }
        .progress { height: 100%; background: #fff; border-radius: 999px; width: 0%; }
        .progress-bar:hover .progress { background: var(--primary); }
        .time { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted-2); margin-top: 2px; }

        .player-bottom-row { grid-column: 3; grid-row: 1 / 3; display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; }
        .player-controls, .controls { display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; }
        .player-volume, .volume-container { display: flex; align-items: center; gap: 8px; justify-content: flex-end; min-width: 180px; }
        .control-btn { width: 34px; height: 34px; border-radius: 50%; background: transparent; color: var(--muted); border: 0; font-size: 1rem; }
        .control-btn:hover, .control-btn.active { background: transparent; color: #fff; }
        .control-btn.big { width: 46px; height: 46px; border-radius: 50%; font-size: 1.2rem; background: #fff; color: #000; border: 0; }
        .control-btn.big:hover { transform: scale(1.08); }
        .volume-slider { width: min(150px, 32vw); accent-color: #fff; }
        .volume-slider:hover { accent-color: var(--primary); }
        .intensity-select { max-width: 128px; padding: 8px 10px; font-size: .78rem; }

        .queue-panel {
            grid-column: 1 / -1;
            grid-row: 3;
            display: none;
            flex-direction: column;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,.08);
        }
        .queue-panel.open { display: flex; max-height: min(42vh, 360px); overflow-y: auto; padding-right: 4px; }
        .queue-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #fff; font-weight: 900; font-size: .9rem; }
        .queue-close-btn { width: 34px; height: 34px; border-radius: 50%; }
        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #242424;
            border: 0;
        }
        .queue-item span, .queue-item strong { color: #fff; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .queue-item small, .queue-item p { color: var(--muted); font-size: .78rem; }

        .global-player.minimized { grid-template-columns: 1fr auto; padding: 8px 12px; }
        .global-player.minimized .player-top { grid-column: 1; }
        .global-player.minimized .player-top img { width: 44px; height: 44px; }
        .global-player.minimized canvas#visualizer,
        .global-player.minimized .progress-container,
        .global-player.minimized .player-volume,
        .global-player.minimized .queue-panel { display: none; }
        .global-player.minimized .player-bottom-row { grid-column: 2; }
        .global-player.minimized .controls .control-btn:not(.big) { display: none; }
        .global-player.audio-only canvas#visualizer,
        .global-player.audio-only .player-top img,
        .global-player.audio-only .queue-panel { display: none; }

        @media (min-width: 901px) {
            .sidebar { display: block; }
            .global-player { left: 0; }
        }

        @media (max-width: 1050px) {
            .global-player { grid-template-columns: 1fr; grid-template-rows: auto; }
            .player-top, .progress-container, canvas#visualizer, .player-bottom-row, .queue-panel { grid-column: 1 !important; grid-row: auto !important; }
            .player-bottom-row { justify-content: center; }
            .player-volume, .volume-container { justify-content: center; }
        }

        @media (max-width: 900px) {
            body { display: block; background: #000; }
            .sidebar { display: none; }
            .main-content { margin: 0; border-radius: 0; padding-bottom: 255px; }
            header { padding-top: 38px; }
            .top-actions .select-input { width: 100%; }
            .soundtrack-list { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; padding: 0 16px; }
            .featured, .battle-zone { padding: 0 16px; }
            .top-actions { padding-left: 16px; padding-right: 16px; }
            header { padding-left: 16px; padding-right: 16px; }
            .card-content { grid-template-columns: 1fr !important; gap: 12px !important; }

            --muted: #a8b3cf;

            --primary: #2f7bff;
            --accent: #ff3c9b;
            --gold: #ffd166;
            --danger: #ff4f72;
            --success: #37f6b3;
            --radius-xl: 28px;
            --radius-lg: 22px;

        body {

        .mini-btn, .pill-btn {

        .mini-btn:hover, .mini-btn.active, .pill-btn:hover, .pill-btn.active,

        .featured-card {

            overflow: hidden;
            border: 1px solid rgba(255,255,255,.11);
            border-radius: 30px;
            background:
                radial-gradient(circle at 20% 20%, rgba(47,123,255,.28), transparent 34%),
                radial-gradient(circle at 78% 24%, rgba(255,60,155,.25), transparent 34%),
                linear-gradient(135deg, rgba(255,255,255,.105), rgba(255,255,255,.035)),
                rgba(8,13,30,.76);

        }

        .featured-card::before {
            content: "";

        .featured-layout.resonance-layout {
            position: relative;

        .featured-cover {
            border-radius: 0;
        }

            height: 62px;
            left: 16px;
            bottom: 16px;
            border: 3px solid rgba(7,11,28,.9);
        }

        .resonance-kicker {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 14px;
            color: #dce5ff;
            font-size: .72rem;
            font-weight: 900;
            letter-spacing: .13em;
            text-transform: uppercase;
        }
        .resonance-kicker::before {

            height: 8px;
            border-radius: 50%;

            box-shadow: 0 0 18px rgba(55,246,179,.8);
        }
        .resonance-title {
            font-size: clamp(2rem, 5vw, 4.2rem);
            line-height: .92;
            letter-spacing: -.065em;
            margin-bottom: 10px;
        }
        .resonance-character {
            color: #9cc0ff;
            font-weight: 850;
            margin-bottom: 14px;
        }
        .resonance-desc {
            color: var(--muted);
            line-height: 1.6;
            max-width: 620px;
            margin-bottom: 18px;
        }
        .resonance-data {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 18px;
        }
        .data-pill {
            padding: 12px;
            border-radius: 18px;
            background: rgba(255,255,255,.065);
            border: 1px solid rgba(255,255,255,.08);
        }
        .data-pill small {
            display: block;

            font-weight: 900;
            letter-spacing: .12em;

        .data-pill strong {

        .resonance-side-info {

            text-overflow: ellipsis;

            color: #dce5ff;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.08);

        .row-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .empty-library {
            padding: 28px;

            border: 1px solid rgba(255,255,255,.09);

            background: rgba(255,255,255,.04);

        .global-player {
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(255,255,255,.10);

        .progress-bar { background: rgba(255,255,255,.16); }

        .control-btn.big { background: linear-gradient(135deg, #2f7bff, #ff3c9b); color: #fff; }

        .battle-card, .lore-box, .cover-modal-box {
            background: rgba(8,13,30,.92);
            border: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(18px);
        }

        @media (max-width: 1120px) {
            .featured-layout.resonance-layout {
                grid-template-columns: minmax(220px, 330px) 1fr;
            }
            .resonance-side-info { grid-column: 1 / -1; }
            .resonance-track-row {
                grid-template-columns: 34px 58px minmax(0, 1fr) 130px;
            }
            .track-mini-cover { width: 58px; height: 58px; border-radius: 15px; }
            .track-tag-cell { display: none; }
        }

        @media (max-width: 900px) {
            .main-content { margin: 0; border-radius: 0; border: 0; padding-bottom: 270px; }
            header { padding-top: 32px; }
            .featured-layout.resonance-layout { grid-template-columns: 1fr; }
            .resonance-data { grid-template-columns: 1fr; }
            .resonance-track-row {
                grid-template-columns: 48px minmax(0, 1fr) auto;
                gap: 10px;
                min-height: 76px;
            }
            .track-number, .track-tag-cell { display: none; }
            .track-mini-cover { width: 48px; height: 48px; border-radius: 14px; }
            .row-actions .icon-btn:not(.fav) { display: none; }
            .row-actions { gap: 6px; }
        }

/* ==========================================================
   RESONANCE V2 - PARCHE FINAL DE INTERFAZ
   Mantiene todo el JavaScript original, pero convierte la web
   en una app multimedia azul oscuro / rosa estilo dashboard.
========================================================== */
:root{
    --r-bg-0:#030716;
    --r-bg-1:#07112d;
    --r-bg-2:#150a28;
    --r-blue:#2b7cff;
    --r-blue-soft:#6ca6ff;
    --r-pink:#ff4fb3;
    --r-pink-soft:#ff89d1;
    --r-purple:#7a5cff;
    --r-glass:rgba(12,20,48,.62);
    --r-glass-2:rgba(255,255,255,.065);
    --r-border:rgba(166,185,255,.18);
    --r-border-pink:rgba(255,79,179,.28);
    --r-text:#f7faff;
    --r-muted:#aab6df;
    --r-muted-2:#6f7ba3;
    --primary:var(--r-blue);
    --accent:var(--r-pink);
    --success:#49ffd0;
    --gold:#ffd166;
    --text:var(--r-text);
    --muted:var(--r-muted);
    --muted-2:var(--r-muted-2);
    --card:rgba(255,255,255,.055);
    --card-hover:rgba(255,255,255,.10);
    --line:rgba(255,255,255,.10);
    --line-strong:rgba(255,255,255,.18);
}

html, body{ min-height:100%; }
body{
    background:
        radial-gradient(circle at 10% 12%, rgba(43,124,255,.28), transparent 30%),
        radial-gradient(circle at 92% 8%, rgba(255,79,179,.24), transparent 34%),
        radial-gradient(circle at 58% 96%, rgba(122,92,255,.16), transparent 40%),
        linear-gradient(135deg, var(--r-bg-0) 0%, var(--r-bg-1) 52%, var(--r-bg-2) 100%) !important;
    color:var(--r-text);
}
body::before{
    background:
        linear-gradient(125deg, rgba(255,255,255,.052), transparent 26%, rgba(255,79,179,.04) 56%, transparent 78%),
        radial-gradient(circle at 42% -18%, rgba(43,124,255,.22), transparent 46%) !important;
    opacity:1 !important;
}
body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,.65), transparent 70%);
}

button, select, input{ font-family:inherit; }

/* ==============================

============================== */
.intro-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
        radial-gradient(circle at 18% 20%, rgba(47, 123, 255, .34), transparent 34%),

        linear-gradient(135deg, #030816 0%, #09112d 48%, #1b0826 100%);
    transition: opacity .75s ease, visibility .75s ease;
}
.intro-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
.intro-screen::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
        linear-gradient(115deg, transparent 0 38%, rgba(255,255,255,.12) 48%, transparent 58% 100%),
        radial-gradient(circle at center, rgba(255,255,255,.06), transparent 42%);
    animation: introSweep 2.6s ease forwards;
}
.intro-orb {
    position: absolute;
    width: min(52vw, 520px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: conic-gradient(from 120deg, rgba(47,123,255,.0), rgba(47,123,255,.42), rgba(255,60,155,.42), rgba(47,123,255,.0));
    filter: blur(34px);
    opacity: .72;
    animation: introOrb 2.4s ease-in-out forwards;
}
.intro-content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 26px;
    animation: introContent 2.45s ease forwards;
}
.intro-logo {
    width: min(68vw, 390px);

        const soundtracks = characters.flatMap((char, characterIndex) =>
            char.tracks.map((track, trackIndex) => ({
                ...track,
                character: char.character,
                characterFace: char.characterFace,
                characterLore: char.lore,
                characterIndex,
                trackIndex
            }))
        );

        let currentIndex = Number(localStorage.getItem('track')) || 0;
        if (!soundtracks[currentIndex]) currentIndex = 0;
        let isPlaying = false;
        let shuffle = JSON.parse(localStorage.getItem('shuffle') || 'false');
        let repeat = JSON.parse(localStorage.getItem('repeat') || 'false');

        let battleMode = false;
        let battlePair = [0, 1];

        let audioContext, analyser, source, dataArray, animationId;

        const audioPlayer = document.createElement('audio');
        audioPlayer.crossOrigin = "anonymous";
        document.body.appendChild(audioPlayer);

        const globalPlayer = document.getElementById('globalPlayer');

        function initVisualizer() {
            const rect = canvasEl.getBoundingClientRect();
            canvasEl.width = Math.max(800, Math.floor(rect.width || 800));
            canvasEl.height = 76;
        }

        function drawVisualizer() {
            if (!analyser) return;
            animationId = requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);
            const ctx = canvasEl.getContext('2d');
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

            const multiplier = intensity === 'finalboss' ? 1.25 : intensity === 'rage' ? 1.05 : 0.85;
            const barWidth = (canvasEl.width / dataArray.length) * (intensity === 'finalboss' ? 2.2 : 1.8);

            for (let i = 0; i < dataArray.length; i++) {
                const value = dataArray[i] * multiplier;
                const barHeight = Math.min((value / 255) * canvasEl.height * 0.9, canvasEl.height);
                const hueBase = intensity === 'finalboss' ? 315 : intensity === 'rage' ? 350 : 180;
                const hue = hueBase + (i / dataArray.length) * 85;
                ctx.fillStyle = `hsla(${hue}, 100%, 65%, .86)`;
                ctx.fillRect(i * barWidth, canvasEl.height - barHeight, barWidth - 3, barHeight);
            }
        }

        function setupAudioContext() {
            if (audioContext) {
                if (audioContext.state === 'suspended') audioContext.resume();
                return;
            }
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 128;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            source = audioContext.createMediaElementSource(audioPlayer);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            drawVisualizer();
        }

        function formatTime(seconds) {
            if (!Number.isFinite(seconds)) return '0:00';
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function updateProgress() {
            if (!audioPlayer.duration) return;
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progress.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            localStorage.setItem('time', audioPlayer.currentTime);
            localStorage.setItem('track', currentIndex);
        }

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (audioPlayer.duration) audioPlayer.currentTime = pos * audioPlayer.duration;
        });

        function dynamicBackground(track) {
            document.body.style.background = '#000';
            const main = document.querySelector('.main-content');
            if (main) {
                main.style.background = `
                    linear-gradient(180deg, rgba(30,215,96,.22) 0%, rgba(18,18,18,.98) 265px),
                    linear-gradient(rgba(18,18,18,.70), rgba(18,18,18,.96)),
                    url('${track.songCover}') top center / cover fixed,
                    #121212`;
            }
        }

        function loadTrack(index, keepTime = false) {
            const track = soundtracks[index];
            currentIndex = index;
            playerCover.src = track.songCover;
            expandedCover.src = track.songCover;
            expandedCoverTitle.textContent = track.songTitle;
            expandedCoverCharacter.textContent = track.character;
            playerTitle.textContent = track.songTitle;
            playerCharacter.textContent = track.character;
            playerMode.textContent = battleMode ? 'BATTLE MODE ACTIVO' : `INTENSIDAD: ${intensity.toUpperCase()}`;
            audioPlayer.src = track.audio;
            audioPlayer.volume = Number(volumeSlider.value);
            globalPlayer.classList.add('show');
            dynamicBackground(track);
            renderAll();
            localStorage.setItem('track', currentIndex);

            if (keepTime) {
                audioPlayer.addEventListener('loadedmetadata', function restore() {
                    audioPlayer.currentTime = Number(localStorage.getItem('time')) || 0;
                    audioPlayer.removeEventListener('loadedmetadata', restore);
                });
            }
        }

        async function togglePlay() {
            if (!audioPlayer.src) loadTrack(currentIndex);

            if (isPlaying) {
                audioPlayer.pause();
                playPauseBtn.textContent = '▶';
                playerCover.classList.remove('playing');
                isPlaying = false;
            } else {
                setupAudioContext();
                try {
                    await audioPlayer.play();
                    playPauseBtn.textContent = '❚❚';
                    playerCover.classList.add('playing');
                    isPlaying = true;
                } catch (err) {
                    alert('No se pudo reproducir el audio. Revisa que el archivo exista en la ruta indicada.');
                }
            }
            renderAll();
        }

        function getNextIndex() {
            if (battleMode) return currentIndex === battlePair[0] ? battlePair[1] : battlePair[0];
            if (shuffle) {
                let next;
                do { next = Math.floor(Math.random() * soundtracks.length); } while (next === currentIndex && soundtracks.length > 1);
                return next;
            }
            return (currentIndex + 1) % soundtracks.length;
        }

        function nextTrack() {
            if (repeat && !battleMode) {
                audioPlayer.currentTime = 0;
                if (isPlaying) audioPlayer.play();
                return;
            }
            currentIndex = getNextIndex();
            loadTrack(currentIndex);
            if (isPlaying) audioPlayer.play();
        }

        function prevTrack() {
            currentIndex = battleMode
                ? (currentIndex === battlePair[0] ? battlePair[1] : battlePair[0])
                : (currentIndex - 1 + soundtracks.length) % soundtracks.length;
            loadTrack(currentIndex);
            if (isPlaying) audioPlayer.play();
        }

        function fadeOutAndNext() {
            const originalVolume = Number(volumeSlider.value);
            const step = Math.max(originalVolume / 20, 0.02);
            const fade = setInterval(() => {
                if (audioPlayer.volume > step) audioPlayer.volume = Math.max(0, audioPlayer.volume - step);
                else {
                    clearInterval(fade);
                    nextTrack();
                    audioPlayer.volume = originalVolume;
                }
            }, 70);
        }

        window.playSpecific = async function(index) {
            const playableIndex = getPlayableIndex(index);
            loadTrack(playableIndex);
            setupAudioContext();
            try {
                await audioPlayer.play();
                isPlaying = true;
                playPauseBtn.textContent = '❚❚';
                playerCover.classList.add('playing');
                renderAll();
            } catch (err) {
                alert('No se pudo reproducir el audio. Revisa que el archivo exista en la ruta indicada.');
            }
        };

        function toggleFavorite(index) {
            if (favorites.includes(index)) favorites = favorites.filter(i => i !== index);
            else favorites.push(index);
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderAll();
        }

        function showLore(index) {
            document.getElementById('loreTitle').textContent = soundtracks[index].songTitle;
            document.getElementById('loreText').textContent = soundtracks[index].lore || soundtracks[index].characterLore;
            document.getElementById('loreModal').classList.add('show');
        }

        function closeLore() { document.getElementById('loreModal').classList.remove('show'); }
        window.closeLore = closeLore;

        function openCoverModal() {
            const track = soundtracks[currentIndex] || soundtracks[0];
            expandedCover.src = track.songCover;
            expandedCoverTitle.textContent = track.songTitle;
            expandedCoverCharacter.textContent = track.character;
            coverModal.classList.add('show');
        }

        function closeCoverModal(event) {
            if (event && !event.target.classList.contains('cover-modal')) return;
            coverModal.classList.remove('show');
        }

        window.closeCoverModal = closeCoverModal;

        function matchesFilters(track, index) {
            const q = searchInput.value.trim().toLowerCase();
            const filter = filterSelect.value;
            const selectedCharacter = characterSelect?.value || 'all';
            const normalizedTags = (track.tags || []).map(tag => String(tag).toLowerCase().replace(/\s+/g, ''));
            const normalizedFilter = String(filter).toLowerCase().replace(/\s+/g, '');
            const text = `${track.character} ${track.songTitle} ${track.songDescription} ${(track.tags || []).join(' ')}`.toLowerCase();
            const qOk = !q || text.includes(q);
            const characterOk = selectedCharacter === 'all' || track.character === selectedCharacter;
            const filterOk = filter === 'all'
                || (filter === 'favorites' && favorites.includes(index))
                || normalizedTags.includes(normalizedFilter);
            return qOk && filterOk && characterOk;
        }

        function characterHasVisibleTrack(characterIndex) {
            return soundtracks.some((track, index) => track.characterIndex === characterIndex && matchesFilters(track, index));
        }

        function renderSidebar() {
            sidebar.innerHTML = '';
            characters.forEach((char, charIndex) => {
                if (!characterHasVisibleTrack(charIndex)) return;
                const firstVisibleTrackIndex = soundtracks.findIndex((track, index) =>
                    track.characterIndex === charIndex && matchesFilters(track, index)
                );
                const totalTracks = char.tracks.length;
                const div = document.createElement('div');
                div.className = `char-item ${soundtracks[currentIndex]?.characterIndex === charIndex ? 'active' : ''}`;
                div.innerHTML = `<img src="${char.characterFace}" alt=""> <div><span>${char.character}</span><small>${totalTracks} canción${totalTracks !== 1 ? 'es' : ''}</small></div>`;
                div.onclick = () => playSpecific(firstVisibleTrackIndex);
                sidebar.appendChild(div);
            });
        }

        function renderFeatured() {
            const track = soundtracks[currentIndex] || soundtracks[0];
            const archiveNumber = String(currentIndex + 1).padStart(3, '0');
            const tags = (track.tags || []).slice(0, 3).join(' · ') || 'Sin clasificación';
            featured.innerHTML = `
                <div class="soundtrack-card featured-card ${isPlaying ? 'playing' : ''}">
                    ${isPlaying ? `<div class="now-playing-badge">SONANDO</div>` : ''}
                    <div class="featured-layout resonance-layout">
                        <div class="featured-cover-wrap resonance-cover">
                            <img class="featured-cover" src="${track.songCover}" alt="${track.songTitle}">
                            <img class="featured-avatar" src="${track.characterFace}" alt="${track.character}">
                        </div>
                        <div class="resonance-main-info">
                            <div class="resonance-kicker">Archive #${archiveNumber} · Now Playing</div>
                            <h2 class="resonance-title">${track.songTitle}</h2>
                            <div class="resonance-character">${track.character}</div>
                            <p class="resonance-desc">${track.songDescription}</p>
                            <div class="actions-row">
                                <button class="play-btn" onclick="playSpecific(${currentIndex})" title="Reproducir">${isPlaying ? '❚❚' : '▶'}</button>
                                <button class="icon-btn fav ${favorites.includes(currentIndex) ? 'active' : ''}" onclick="toggleFavorite(${currentIndex})" title="Favorito">⭐</button>
                                <button class="icon-btn" onclick="showLore(${currentIndex})" title="Ver lore">📖</button>
                                <button class="icon-btn" onclick="setBattleFighter(${currentIndex})" title="Battle mode">⚔️</button>
                            </div>
                            <div class="resonance-data">
                                <div class="data-pill"><small>Subject</small><strong>${track.character}</strong></div>
                                <div class="data-pill"><small>Class</small><strong>${tags}</strong></div>
                                <div class="data-pill"><small>Status</small><strong>${isPlaying ? 'Active' : 'Ready'}</strong></div>
                            </div>
                        </div>
                        <aside class="resonance-side-info">
                            <div>
                                <div class="track-meta">LORE SIGNAL</div>
                                <p class="resonance-lore-preview">${track.lore || track.characterLore || 'Sin lore registrado todavía.'}</p>
                            </div>
                            <button class="pill-btn" onclick="showLore(${currentIndex})">Abrir archivo completo</button>
                        </aside>
                    </div>
                </div>
            `;
        }

        function tagHTML(tags) {
            return (tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');
        }

        function populateCharacterSelect() {
            const uniqueCharacters = [...new Set(soundtracks.map(track => track.character))];
            characterSelect.innerHTML = '<option value="all">Todos los personajes</option>' +
                uniqueCharacters.map(name => `<option value="${name}">${name}</option>`).join('');
        }

        function getQueueTracks() {
            return soundtracks.slice(currentIndex + 1).concat(soundtracks.slice(0, currentIndex + 1));
        }

        function renderQueue() {
            const queueTracks = getQueueTracks();
            const currentTrack = soundtracks[currentIndex];
            const itemsHTML = queueTracks.map((track) => {
                const realIndex = soundtracks.findIndex(item =>
                    item.characterIndex === track.characterIndex && item.trackIndex === track.trackIndex
                );
                const isCurrent = currentTrack && realIndex === currentIndex;
                return `
                    <div class="queue-item ${isCurrent ? 'playing-row' : ''}">
                        <div>
                            <strong>${isCurrent ? '▶ ' : ''}${track.songTitle}</strong>
                            <p>${track.character}</p>
                        </div>
                        <button class="icon-btn" onclick="playSpecific(${realIndex})">▶</button>
                    </div>
                `;
            }).join('');

            queuePanel.innerHTML = `
                <div class="queue-header">
                    <span>Cola de reproducción · ${queueTracks.length} pista${queueTracks.length !== 1 ? 's' : ''}</span>
                    <button class="icon-btn queue-close-btn" onclick="closeQueuePanel()" title="Cerrar cola">✕</button>
                </div>
                ${itemsHTML || '<div class="queue-item">No hay pistas en la cola</div>'}
            `;

            queuePanel.classList.toggle('open', queueOpen);
        }

        function closeQueuePanel() {
            queueOpen = false;
            localStorage.setItem('queueOpen', JSON.stringify(queueOpen));
            renderAll();
        }
        window.closeQueuePanel = closeQueuePanel;

        function toggleAudioOnly() {
            audioOnly = !audioOnly;
            localStorage.setItem('audioOnly', JSON.stringify(audioOnly));
            if (audioOnly) {
                globalPlayer.classList.add('audio-only');
                toggleAudioOnlyBtn.textContent = '🎧 Visualizador off';
            } else {
                globalPlayer.classList.remove('audio-only');
                toggleAudioOnlyBtn.textContent = '🎧 Solo audio';
            }
        }

        function toggleQueuePanel() {
            queueOpen = !queueOpen;
            localStorage.setItem('queueOpen', JSON.stringify(queueOpen));
            queuePanel.classList.toggle('open', queueOpen);
            toggleQueueBtn.textContent = queueOpen ? '📜 Ocultar cola' : '📜 Cola';
        }

        function normalizeQueueIndex(value) {
            const characterIndex = Math.floor(value / 1000);
            const trackIndex = value % 1000;
            return soundtracks.findIndex(track => track.characterIndex === characterIndex && track.trackIndex === trackIndex);
        }

        function resolveQueuePlay(value) {
            const index = Number(value);
            if (index >= 1000) return normalizeQueueIndex(index);
            return index;
        }

        function getPlayableIndex(value) {
            return resolveQueuePlay(value);
        }

        function renderList() {
            list.innerHTML = '';
            list.classList.add('library-shell');

            const visible = soundtracks
                .map((track, index) => ({ track, index }))
                .filter(item => matchesFilters(item.track, item.index));

            const subtitle = filterSelect.value === 'favorites'
                ? 'Tus temas marcados como favoritos'
                : filterSelect.value === 'calm'
                    ? 'Canciones para conversaciones, descansos y momentos tranquilos'
                    : 'Canciones agrupadas por personaje para que cada una tenga identidad propia';

            const header = document.createElement('div');
            header.className = 'library-header';
            header.innerHTML = `
                <div>
                    <h2>Biblioteca Resonance</h2>
                    <p>${subtitle}</p>
                </div>
                <p>${visible.length} archivo${visible.length !== 1 ? 's' : ''}</p>
            `;
            list.appendChild(header);

            if (!visible.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-library';
                empty.textContent = 'No hay canciones que coincidan con esos filtros.';
                list.appendChild(empty);
                return;
            }

            characters.forEach((char, charIndex) => {
                const tracksForCharacter = visible.filter(item => item.track.characterIndex === charIndex);
                if (!tracksForCharacter.length) return;

                const section = document.createElement('section');
                section.className = 'character-section';
                section.innerHTML = `
                    <div class="character-section-title">
                        <img src="${char.characterFace}" alt="${char.character}">
                        <div>
                            <h3>${char.character}</h3>
                            <small>${tracksForCharacter.length} archivo${tracksForCharacter.length !== 1 ? 's' : ''} de resonancia</small>
                        </div>
                    </div>
                `;

                tracksForCharacter.forEach(({ track, index }) => {
                    const row = document.createElement('article');
                    row.className = `resonance-track-row ${index === currentIndex ? 'playing-row' : ''}`;
                    row.innerHTML = `
                        <div class="track-number">${String(index + 1).padStart(2, '0')}</div>
                        <img class="track-mini-cover" src="${track.songCover}" alt="${track.songTitle}">
                        <div class="track-main-title">
                            <h3>${index === currentIndex && isPlaying ? '▶ ' : ''}${track.songTitle}</h3>
                            <p>${track.songDescription}</p>
                        </div>
                        <div class="track-tag-cell"><div class="track-tags">${tagHTML(track.tags)}</div></div>
                        <div class="row-actions">
                            <button class="icon-btn" onclick="playSpecific(${index})" title="Reproducir">▶</button>
                            <button class="icon-btn fav ${favorites.includes(index) ? 'active' : ''}" onclick="toggleFavorite(${index})" title="Favorito">⭐</button>
                            <button class="icon-btn" onclick="showLore(${index})" title="Lore">📖</button>
                            <button class="icon-btn" onclick="setBattleFighter(${index})" title="Battle">⚔️</button>
                        </div>
                    `;
                    row.addEventListener('dblclick', () => playSpecific(index));
                    section.appendChild(row);
                });

                list.appendChild(section);
            });
        }

        function renderBattleZone() {
            if (!battleMode) {
                battleZone.classList.remove('show');
                return;
            }
            const a = soundtracks[battlePair[0]];
            const b = soundtracks[battlePair[1]];
            battleZone.classList.add('show');
            battleZone.innerHTML = `
                <div class="battle-card">
                    <div class="battle-grid">
                        <div class="battle-fighter">
                            <img src="${a.characterFace}">
                            <div><div class="track-meta">${a.character}</div><h2>${a.songTitle}</h2></div>
                        </div>
                        <div class="vs">VS</div>
                        <div class="battle-fighter">
                            <img src="${b.characterFace}">
                            <div><div class="track-meta">${b.character}</div><h2>${b.songTitle}</h2></div>
                        </div>
                    </div>
                    <div class="top-actions" style="padding:18px 0 0;">
                        <button class="pill-btn" onclick="playSpecific(${battlePair[0]})">Reproducir A</button>
                        <button class="pill-btn" onclick="playSpecific(${battlePair[1]})">Reproducir B</button>
                        <button class="pill-btn" onclick="randomBattlePair()">Cambiar combate</button>
                    </div>
                </div>
            `;
        }

        function renderButtons() {
            shuffleBtn.classList.toggle('active', shuffle);
            repeatBtn.classList.toggle('active', repeat);
            shuffleTopBtn.classList.toggle('active', shuffle);
            battleTopBtn.classList.toggle('active', battleMode);
            document.getElementById('toggleBattleBtn').classList.toggle('active', battleMode);
            document.getElementById('showAllBtn').classList.toggle('active', filterSelect.value === 'all');
            document.getElementById('showCalmBtn').classList.toggle('active', filterSelect.value === 'calm');
            document.getElementById('showFavBtn').classList.toggle('active', filterSelect.value === 'favorites');
            document.body.classList.toggle('battle-mode-active', battleMode);
            intensitySelect.value = intensity;
            toggleMiniBtn.classList.toggle('active', miniPlayer);
            toggleMiniBtn.textContent = miniPlayer ? '⬆️ Expandir' : '📉 Compacto';
            toggleAudioOnlyBtn.classList.toggle('active', audioOnly);
            toggleAudioOnlyBtn.textContent = audioOnly ? '🎧 Visualizador off' : '🎧 Solo audio';
            toggleQueueBtn.classList.toggle('active', queueOpen);
            toggleQueueBtn.textContent = queueOpen ? '📜 Ocultar cola' : '📜 Cola';
            globalPlayer.classList.toggle('minimized', miniPlayer);
            globalPlayer.classList.toggle('audio-only', audioOnly);
            queuePanel.classList.toggle('open', queueOpen);
            localStorage.setItem('shuffle', JSON.stringify(shuffle));
            localStorage.setItem('repeat', JSON.stringify(repeat));
            localStorage.setItem('intensity', intensity);
            localStorage.setItem('miniPlayer', JSON.stringify(miniPlayer));
            localStorage.setItem('audioOnly', JSON.stringify(audioOnly));
            localStorage.setItem('queueOpen', JSON.stringify(queueOpen));
        }

        function renderAll() {
            renderButtons();
            renderSidebar();
            renderFeatured();
            renderList();
            renderQueue();
            renderBattleZone();
        }

        window.toggleFavorite = toggleFavorite;
        window.showLore = showLore;

        function setBattleFighter(index) {
            battlePair = [currentIndex, index === currentIndex ? (index + 1) % soundtracks.length : index];
            battleMode = true;
            renderAll();
            battleZone.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        window.setBattleFighter = setBattleFighter;

        function randomBattlePair() {
            const a = Math.floor(Math.random() * soundtracks.length);
            let b;
            do { b = Math.floor(Math.random() * soundtracks.length); } while (b === a);
            battlePair = [a, b];
            renderAll();
        }
        window.randomBattlePair = randomBattlePair;

        shuffleBtn.onclick = shuffleTopBtn.onclick = () => { shuffle = !shuffle; renderAll(); };
        repeatBtn.onclick = () => { repeat = !repeat; renderAll(); };
        battleTopBtn.onclick = document.getElementById('toggleBattleBtn').onclick = () => {
            battleMode = !battleMode;
            if (battleMode) {
                battlePair = [currentIndex, (currentIndex + 1) % soundtracks.length];
                battleZone.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            renderAll();
        };

        document.getElementById('showFavBtn').onclick = () => { filterSelect.value = 'favorites'; renderAll(); };
        document.getElementById('showCalmBtn').onclick = () => { filterSelect.value = 'calm'; searchInput.value = ''; renderAll(); };
        document.getElementById('showAllBtn').onclick = () => { filterSelect.value = 'all'; searchInput.value = ''; renderAll(); };
        toggleMiniBtn.onclick = () => { miniPlayer = !miniPlayer; renderAll(); };
        toggleAudioOnlyBtn.onclick = () => { toggleAudioOnly(); renderAll(); };
        toggleQueueBtn.onclick = () => { toggleQueuePanel(); renderAll(); };
        expandCoverBtn.onclick = openCoverModal;
        playerCover.onclick = openCoverModal;
        playerCover.style.cursor = 'zoom-in';
        characterSelect.addEventListener('change', renderAll);

        searchInput.addEventListener('input', renderAll);
        filterSelect.addEventListener('change', renderAll);

        intensitySelect.addEventListener('change', () => {
            intensity = intensitySelect.value;
            playerMode.textContent = `INTENSIDAD: ${intensity.toUpperCase()}`;
            renderButtons();
        });

        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audioPlayer.duration); });
        audioPlayer.addEventListener('ended', nextTrack);

        volumeSlider.addEventListener('input', () => {
            audioPlayer.volume = Number(volumeSlider.value);
            const icon = document.querySelector('.volume-icon');
            if (volumeSlider.value == 0) icon.textContent = '🔇';
            else if (volumeSlider.value < 0.4) icon.textContent = '🔈';
            else if (volumeSlider.value < 0.7) icon.textContent = '🔉';
            else icon.textContent = '🔊';
        });

        document.addEventListener('keydown', (e) => {
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.code === 'ArrowRight') nextTrack();
            if (e.code === 'ArrowLeft') prevTrack();
            if (e.key.toLowerCase() === 'f') toggleFavorite(currentIndex);
            if (e.key === 'Escape') {
                closeLore();
                closeCoverModal();
            }
        });

        window.addEventListener('resize', initVisualizer);


        // Animación inicial de Resonance
        const introScreen = document.getElementById('introScreen');

        window.addEventListener('load', () => {
            setTimeout(() => {
                if (introScreen) introScreen.classList.add('hide');
            }, 2550);
        });

        initVisualizer();
        populateCharacterSelect();
        loadTrack(currentIndex, true);
        renderAll();
    </script>
</body>
</html>
