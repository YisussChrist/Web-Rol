<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090715">
  <meta name="description" content="RP HUB con reproductor persistente de Resonance.">
  <title>RP HUB · Resonance</title>
  <script>window.__RP_SHELL_NESTED__=window.self!==window.top;if(window.__RP_SHELL_NESTED__)window.parent.postMessage({type:'rp-shell-navigate',route:'hub.html'},'*');</script>
  <link rel="stylesheet" href="resonance-shell.css?v=1">
</head>
<body>
  <main class="page-stage" id="pageStage">
    <iframe id="siteFrame" title="Contenido de RP HUB" allow="autoplay; fullscreen; clipboard-read; clipboard-write"></iframe>
    <div class="page-loading" id="pageLoading"><span></span><strong>Abriendo archivo…</strong></div>
  </main>

  <footer class="resonance-bar" id="resonanceBar" aria-label="Reproductor global de Resonance">
    <div class="shell-actions">
      <button class="shell-button home-button" id="homeButton" type="button" aria-label="Volver al HUB" title="Volver al HUB">RP</button>
      <button class="track-summary" id="openResonance" type="button" aria-label="Abrir Resonance">
        <span class="cover"><img id="globalCover" src="OST/ResonanceLogo.png" alt=""><i id="playingPulse"></i></span>
        <span class="track-copy"><small id="pageLabel">RESONANCE · REPRODUCTOR GLOBAL</small><strong id="globalTitle">Elige una canción</strong><span id="globalArtist">La música continuará al navegar</span></span>
      </button>
    </div>

    <div class="player-main">
      <div class="player-controls">
        <button class="control-button shuffle" id="globalShuffle" type="button" aria-label="Reproducción aleatoria" title="Aleatorio">⤨</button>
        <button class="control-button" id="globalPrevious" type="button" aria-label="Canción anterior">‹</button>
        <button class="play-button" id="globalPlay" type="button" aria-label="Reproducir">▶</button>
        <button class="control-button" id="globalNext" type="button" aria-label="Canción siguiente">›</button>
        <button class="control-button" id="queueButton" type="button" aria-label="Abrir cola" title="Cola">≡</button>
      </div>
      <div class="timeline"><span id="globalCurrent">0:00</span><input id="globalProgress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posición de reproducción"><span id="globalDuration">0:00</span></div>
    </div>

    <div class="volume-controls">
      <button class="volume-button" id="globalMute" type="button" aria-label="Silenciar">◖</button>
      <input id="globalVolume" type="range" min="0" max="1" value="0.85" step="0.01" aria-label="Volumen">
      <button class="collapse-button" id="collapsePlayer" type="button" aria-label="Minimizar reproductor" title="Minimizar">⌄</button>
    </div>
  </footer>

  <button class="mini-player" id="miniPlayer" type="button" hidden><span id="miniIcon">▶</span><strong id="miniTitle">Resonance</strong><span>⌃</span></button>

  <aside class="queue-panel" id="globalQueue" aria-hidden="true">
    <header><div><small>A CONTINUACIÓN</small><h2>Cola de Resonance</h2></div><button id="closeQueue" type="button" aria-label="Cerrar">×</button></header>
    <div id="globalQueueList" class="queue-list"></div>
  </aside>

  <div class="resume-notice" id="resumeNotice" hidden><span>La canción estaba reproduciéndose antes de recargar.</span><button id="resumeButton" type="button">Continuar</button></div>
  <audio id="globalAudio" preload="metadata"></audio>
  <script src="OST/data.js"></script>
  <script src="resonance-shell.js?v=1"></script>
</body>
</html>
