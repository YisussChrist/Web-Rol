<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Web-Rol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="contenedor">

    <h1>🌍 Sala de Rol</h1>

    <section class="panel-superior">

    <div class="selector-personaje">
        <label for="personaje">Personaje activo</label>

        <select id="personaje">
            <option value="Renzu">🔥 Renzu Itō</option>
            <option value="Freyja">⚔️ Freyja Kane</option>
            <option value="Tao">🐉 Tao Saotome</option>
        </select>
    </div>

    <div class="lugar-activo">
        <span>Lugar actual</span>
        <strong id="nombreLugarActivo">Ningún lugar seleccionado</strong>
    </div>

</section>

<section class="zona-lugares">

    <h2>🌍 Lugares de rol</h2>

    <input 
        type="text" 
        id="buscadorLugares" 
        placeholder="Buscar lugar..."
    >

    <div id="categoriasLugares"></div>

    <div id="lugaresGrid"></div>

</section>

    <div id="chat"></div>

    <div class="input-area">

    <textarea
        id="mensaje"
        placeholder="Escribe tu mensaje..."
    ></textarea>

    <button onclick="enviarMensaje()">
        Enviar
    </button>

</div>

</div>

<script src="app.js"></script>
</body>
</html>
