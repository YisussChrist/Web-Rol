<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Escala de fuerza de Dragon Ball con niveles de poder, transformaciones y comparación de personajes.">
  <title>Escala de Fuerza — Vista Moderna</title>
<link rel="stylesheet" href="assets/css/poder.css">
</head>
<body class="dark-mode">
  <header class="appbar" role="banner">
    <div class="brand">🟢 Scouter de Fuerza</div>
    <div class="appbar-main">
      <div class="search-wrap">
        <input id="global-search" type="search" placeholder="Buscar personajes o transformaciones… (pulsa /)" aria-label="Buscar">
        <button id="clear-search" class="ghost" aria-label="Limpiar">✕</button>
      </div>
      <div class="controls">
        <div class="chip-group" id="range-chips" role="group" aria-label="Filtrar por rango de fuerza">
          <button class="chip" data-range="lt1m" aria-pressed="false">&lt; 1M</button>
          <button class="chip" data-range="1to10" aria-pressed="false">1–10M</button>
          <button class="chip" data-range="10to100" aria-pressed="false">10–100M</button>
          <button class="chip" data-range="100plus" aria-pressed="false">100M+</button>
          <button class="chip" data-range="unknown" aria-pressed="false">???</button>
        </div>
        <label class="filter-toggle" title="Oculta los personajes que tengan fuerza vacía o ???">
          <input id="hide-unknown-power" type="checkbox">
          Ocultar sin poder
        </label>
        <label class="select-wrap">
          <span class="sr-only">Ordenar</span>
          <select id="sort-select" aria-label="Ordenar">
            <option value="strength">Fuerza (desc)</option>
            <option value="az">Nombre A→Z</option>
          </select>
        </label>
        <button id="theme-toggle" class="icon-btn" aria-pressed="false" title="Alternar tema">🌙</button>
      </div>
    </div>
  </header>

  <section id="stats-bar" aria-live="polite"></section>

  <main class="container">
    <section class="threat-board" aria-labelledby="top-threat-title">
      <h2 id="top-threat-title">Top 5 amenazas detectadas</h2>
      <div id="top-threats" class="threat-grid"></div>
    </section>

    <section class="scale-card">
  <h2>Escala de poder</h2>

  <div class="power-rail">
    <div class="rail"></div>
    <div class="rail-label min">Humano con ganas</div>
    <div class="rail-label max">Amenaza nivel dios</div>
  </div>

  <p class="scale-note">
    Escala logarítmica basada en los personajes visibles. El scouter prioriza las 20 mayores lecturas actuales.
  </p>
</section>


    <section id="characters-list">
      <div class="list-header">
        <h2>Base de datos de combatientes</h2>
        <button id="collapse-all" class="ghost small">Bloquear transformaciones</button>
      </div>
      <ul id="character-list"></ul>
    </section>
  </main>

  <button id="scroll-top" class="icon-fab" title="Subir">↑</button>

  <script src="assets/js/poder-datos.js"></script>
  <script src="assets/js/poder.js"></script>
</body>
</html>
