<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escala de Fuerza — Vista Moderna</title>
<style>
/* === Dragon Ball Scouter / Ranking de Amenaza === */
:root{
  --bg:#030604;
  --bg-soft:#07120b;
  --card:#09150d;
  --card-2:#0d1f13;
  --text:#eaffef;
  --muted:#8bb996;
  --accent:#7CFF6B;
  --accent-2:#00f5ff;
  --danger:#ff3b3b;
  --gold:#ffd86b;
  --purple:#c084fc;
  --unknown:#b6b6c8;
  --ring:rgba(124,255,107,.35);
  --radius:14px;
  --radius-lg:22px;
  --shadow:0 18px 45px rgba(0,0,0,.55);
  --glass:rgba(124,255,107,.06);
  --line:rgba(124,255,107,.18);
}

body.light-mode{
  --bg:#06100a;
  --bg-soft:#0c1f12;
  --card:#102418;
  --card-2:#153320;
  --text:#effff2;
  --muted:#a7d7b0;
  --accent:#7CFF6B;
  --accent-2:#00eaff;
  --ring:rgba(124,255,107,.35);
  --shadow:0 18px 45px rgba(0,0,0,.55);
  --glass:rgba(124,255,107,.07);
}

body.dark-mode{
  --bg:#020403;
  --bg-soft:#07120b;
  --card:#08130c;
  --card-2:#0c2012;
  --text:#eaffef;
  --muted:#8bb996;
  --accent:#7CFF6B;
  --accent-2:#00f5ff;
  --ring:rgba(124,255,107,.36);
  --shadow:0 18px 45px rgba(0,0,0,.65);
  --glass:rgba(124,255,107,.06);
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 12% 0%, rgba(124,255,107,.18), transparent 58%),
    radial-gradient(780px 520px at 95% 8%, rgba(0,245,255,.12), transparent 58%),
    radial-gradient(1000px 700px at 50% 120%, rgba(255,59,59,.11), transparent 60%),
    linear-gradient(135deg,#020302,#071109 45%,#020403);
  background-attachment:fixed;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    linear-gradient(rgba(124,255,107,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,255,107,.045) 1px, transparent 1px),
    radial-gradient(circle at center, transparent 0 35%, rgba(0,0,0,.35) 72%, rgba(0,0,0,.72));
  background-size:34px 34px,34px 34px,100% 100%;
  opacity:.8;
}

body::after{
  content:"SCOUTER ONLINE  //  POWER INDEX  //  THREAT DATABASE";
  position:fixed;
  left:18px;
  bottom:12px;
  color:rgba(124,255,107,.25);
  font-size:.72rem;
  letter-spacing:3px;
  pointer-events:none;
  z-index:0;
}

.appbar,.container,#stats-bar,.icon-fab{position:relative;z-index:1}

/* === Appbar === */
.appbar{
  position:sticky;
  top:0;
  z-index:50;
  padding:14px clamp(12px,2.5vw,26px);
  background:linear-gradient(180deg, rgba(2,8,4,.96), rgba(2,8,4,.78));
  border-bottom:1px solid var(--line);
  box-shadow:0 12px 35px rgba(0,0,0,.55), inset 0 -1px 0 rgba(124,255,107,.12);
  backdrop-filter:blur(12px) saturate(160%);
}

.brand{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-weight:1000;
  font-size:clamp(1.15rem,2vw,1.65rem);
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--accent);
  text-shadow:0 0 14px rgba(124,255,107,.55);
}

.brand::after{
  content:"ANALIZANDO NIVEL DE PODER...";
  font-size:.68rem;
  font-weight:800;
  letter-spacing:2px;
  color:rgba(0,245,255,.8);
  padding:5px 8px;
  border:1px solid rgba(0,245,255,.22);
  border-radius:999px;
  background:rgba(0,245,255,.06);
}

.appbar-main{
  margin-top:12px;
  display:grid;
  gap:12px;
  grid-template-columns:1fr auto;
  align-items:center;
}

.search-wrap{position:relative;display:flex;align-items:center}
#global-search{
  width:100%;
  border:1px solid rgba(124,255,107,.25);
  padding:13px 44px 13px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.35);
  color:var(--text);
  outline:none;
  box-shadow:inset 0 0 18px rgba(124,255,107,.05);
  font-weight:700;
}
#global-search::placeholder{color:rgba(139,185,150,.72)}
#global-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring), inset 0 0 20px rgba(124,255,107,.08)}
#clear-search{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:10px;cursor:pointer;
}
#clear-search:hover{color:var(--accent)}

.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.select-wrap select{
  appearance:none;
  border-radius:10px;
  border:1px solid rgba(124,255,107,.25);
  background:#06100a;
  color:var(--text);
  padding:11px 14px;
  font-weight:800;
}
.select-wrap select option{background:#06100a;color:var(--text)}
.icon-btn,.ghost{
  border:1px solid rgba(124,255,107,.22);
  background:rgba(124,255,107,.06);
  color:var(--text);
  border-radius:12px;
  padding:10px 12px;
  cursor:pointer;
  font-weight:800;
}
.icon-btn:hover,.ghost:hover{box-shadow:0 0 0 3px var(--ring);color:var(--accent)}
.ghost.small{font-size:.85rem;padding:8px 10px}

.filter-toggle{
  display:inline-flex;
  align-items:center;
  gap:9px;
  border:1px solid rgba(124,255,107,.22);
  background:rgba(0,0,0,.28);
  color:var(--muted);
  padding:9px 12px;
  border-radius:999px;
  cursor:pointer;
  transition:.15s ease;
  font-weight:900;
  user-select:none;
}
.filter-toggle:hover{
  color:var(--accent);
  box-shadow:0 0 0 3px var(--ring);
}
.filter-toggle input{
  width:16px;
  height:16px;
  accent-color:var(--accent);
}
.filter-toggle:has(input:checked){
  background:linear-gradient(90deg, rgba(124,255,107,.22), rgba(0,245,255,.14));
  color:#fff;
  border-color:rgba(124,255,107,.72);
  box-shadow:0 0 16px rgba(124,255,107,.25);
}


/* Chips */
.chip-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{
  border:1px solid rgba(124,255,107,.22);
  background:rgba(0,0,0,.28);
  color:var(--muted);
  padding:9px 12px;
  border-radius:999px;
  cursor:pointer;
  transition:.15s ease;
  font-weight:900;
}
.chip.active{
  background:linear-gradient(90deg, rgba(124,255,107,.22), rgba(0,245,255,.14));
  color:#fff;
  border-color:rgba(124,255,107,.72);
  box-shadow:0 0 16px rgba(124,255,107,.25);
}
.chip:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

/* Stats */
#stats-bar{
  width:min(1200px,94vw);
  margin:14px auto 0;
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  background:linear-gradient(135deg, rgba(9,21,13,.94), rgba(3,7,4,.86));
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:12px 14px;
  box-shadow:var(--shadow);
}
#stats-bar .stat{color:var(--muted);font-weight:800}
#stats-bar strong{color:var(--accent);font-size:1.05rem;text-shadow:0 0 10px rgba(124,255,107,.35)}
#stats-bar .badges{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
.badge{padding:5px 9px;border-radius:999px;font-weight:1000;font-size:.78rem;color:#08100b;border:1px solid transparent}
.badge.ok{background:var(--accent)}
.badge.warn{background:var(--gold)}
.badge.err{background:#ff8a8a}

/* Layout */
.container{width:min(1200px,94vw);margin:20px auto;display:grid;gap:18px}
.scale-card,#characters-list,.threat-board{
  background:linear-gradient(145deg, rgba(9,21,13,.96), rgba(4,8,5,.92));
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:18px;
  box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.025);
  overflow:hidden;
}
.scale-card h2,.list-header h2,.threat-board h2{
  margin:.1rem 0 1rem;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--accent);
  text-shadow:0 0 12px rgba(124,255,107,.35);
}
.list-header{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Top Threats */
.threat-board{position:relative}
.threat-board::before{
  content:"TOP THREAT";
  position:absolute;
  right:-18px;
  top:18px;
  transform:rotate(18deg);
  color:rgba(255,216,107,.12);
  font-size:4rem;
  font-weight:1000;
  letter-spacing:5px;
  pointer-events:none;
}
.threat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.threat-card{
  position:relative;
  min-height:190px;
  padding:12px;
  border-radius:18px;
  background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(0,0,0,.25)), var(--card-2);
  border:1px solid rgba(124,255,107,.18);
  overflow:hidden;
}
.threat-card.rank-1{border-color:rgba(255,216,107,.65);box-shadow:0 0 26px rgba(255,216,107,.16)}
.threat-card::after{
  content:"";
  position:absolute;inset:auto -20% -40% -20%;height:80%;
  background:radial-gradient(circle, rgba(124,255,107,.18), transparent 62%);
}
.threat-rank{
  position:absolute;top:9px;left:9px;z-index:2;
  width:34px;height:34px;display:grid;place-items:center;
  border-radius:10px;background:#06100a;border:1px solid rgba(255,255,255,.12);
  color:var(--gold);font-weight:1000;
}
.threat-card .avatar,.threat-card img{
  width:78px;height:78px;margin:26px auto 10px;display:grid;
}
.threat-name{position:relative;z-index:1;font-weight:1000;text-align:center;line-height:1.1}
.threat-power{position:relative;z-index:1;text-align:center;color:var(--accent);font-weight:1000;margin-top:5px}

/* Power rail */
.power-rail{position:relative;height:108px;margin:2rem 0 1.4rem}
.rail{
  position:absolute;top:50%;left:0;right:0;height:8px;border-radius:999px;
  background:linear-gradient(90deg,#41ffb0,#7CFF6B,#ffd86b,#ff3b3b,#c084fc);
  transform:translateY(-50%);
  box-shadow:0 0 20px rgba(124,255,107,.45);
}
.rail-label{position:absolute;top:100%;margin-top:10px;font-size:.86rem;color:var(--muted);font-weight:800}
.rail-label.min{left:0}.rail-label.max{right:0}
.scale-note{color:var(--muted);margin-top:.25rem;font-weight:700}
.power-node{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:48px;height:48px;border-radius:50%;
  background:var(--card);border:3px solid var(--accent);
  box-shadow:0 8px 18px rgba(0,0,0,.5),0 0 16px rgba(124,255,107,.28);
  z-index:2;
}
.power-node img,.power-node .power-avatar{width:100%;height:100%;object-fit:cover;border-radius:50%}

/* List */
#character-list{list-style:none;padding:0;margin:1.3rem 0 0;display:grid;gap:12px}
.character-item{
  position:relative;
  display:grid;
  grid-template-columns:68px 1fr auto;
  gap:12px;
  align-items:center;
  padding:12px;
  border-radius:18px;
  background:linear-gradient(135deg, rgba(255,255,255,.04), rgba(124,255,107,.035));
  border:1px solid rgba(124,255,107,.16);
  overflow:hidden;
  transition:.15s ease;
}
.character-item::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tier-color,var(--accent));
  box-shadow:0 0 18px var(--tier-color,var(--accent));
}
.character-item::after{
  content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 50%, color-mix(in srgb, var(--tier-color,var(--accent)) 18%, transparent), transparent 35%);pointer-events:none;opacity:.8;
}
.character-item:hover{transform:translateX(4px);border-color:var(--tier-color,var(--accent));box-shadow:0 0 24px color-mix(in srgb, var(--tier-color,var(--accent)) 18%, transparent)}
.character-item.unknown-card{border-style:dashed;filter:saturate(.85)}
.character-item > *{position:relative;z-index:1}
.character-item .avatar,.character-item img.avatar{width:58px;height:58px;border-radius:16px;object-fit:cover}
.character-item .meta{display:flex;flex-direction:column;gap:4px}
.character-item .name{font-weight:1000;font-size:1.04rem;letter-spacing:.2px}
.character-item .power{color:var(--muted);font-size:.92rem;font-weight:800}
.tier-badge{
  display:inline-flex;align-items:center;gap:6px;
  width:max-content;margin-top:3px;
  padding:4px 8px;border-radius:999px;
  color:#041007;background:var(--tier-color,var(--accent));
  font-weight:1000;font-size:.74rem;text-transform:uppercase;
}
.character-item .actions{display:flex;gap:8px;justify-content:flex-end}
.toggle-button,#character-list > button{
  background:rgba(0,0,0,.28);color:var(--text);border:1px solid rgba(124,255,107,.2);
  font-size:.9rem;padding:9px 11px;cursor:pointer;border-radius:12px;transition:.15s ease;font-weight:900;
}
.toggle-button:hover,#character-list > button:hover{transform:translateY(-2px);color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.transformation{grid-column:2 / -1;margin-top:8px;display:grid;gap:8px}
.transformation.hidden{display:none}
.transformation-item{
  display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;
  padding:10px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);
}
.transformation-item .avatar,.transformation-item img.avatar{width:48px;height:48px;border-radius:14px;object-fit:cover}
.multiplier{font-weight:1000;margin-left:6px;padding:3px 7px;border-radius:8px;transition:all .2s ease;background:rgba(0,0,0,.22)}
.multiplier.glow{box-shadow:0 0 8px currentColor,0 0 18px currentColor;animation:pulseGlow 1.5s infinite alternate}
@keyframes pulseGlow{from{transform:scale(1)}to{transform:scale(1.08)}}

/* Avatares sin imágenes */
.avatar,.power-avatar{
  display:inline-grid;place-items:center;border-radius:50%;font-weight:1000;user-select:none;text-transform:uppercase;letter-spacing:.3px;
  color:#041007;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.45),transparent 35%),linear-gradient(135deg,var(--accent),var(--accent-2));
  border:2px solid rgba(255,255,255,.16);box-shadow:0 8px 20px rgba(0,0,0,.28);
}
.power-node .power-avatar{font-size:.75rem}

/* Scroll */
.icon-fab{
  position:fixed;bottom:18px;right:18px;z-index:40;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:#041007;border:none;box-shadow:var(--shadow);transform:translateY(80px);opacity:0;transition:.25s ease;cursor:pointer;font-weight:1000;
}
.icon-fab.show{transform:translateY(0);opacity:1}

/* Utility */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
img{image-rendering:-webkit-optimize-contrast}

/* Responsive */
@media(max-width:1050px){.threat-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.appbar-main{grid-template-columns:1fr}.controls{justify-content:flex-start}.brand::after{display:none}}
@media(max-width:700px){
  .threat-grid{grid-template-columns:repeat(2,1fr)}
  .list-header{flex-direction:column;align-items:stretch}
  .character-item{grid-template-columns:56px 1fr}
  .character-item .actions{grid-column:1 / -1;width:100%}
  .toggle-button{width:100%}
  .transformation{grid-column:1 / -1}
  .character-item .avatar,.character-item img.avatar{width:50px;height:50px}
  .chip{flex:1 1 calc(50% - 8px);text-align:center}
  #stats-bar .badges{margin-left:0;width:100%}
}
@media(max-width:450px){.threat-grid{grid-template-columns:1fr}.chip{flex-basis:100%}.power-node{width:40px;height:40px}.power-rail{height:90px}}
</style>
</head>

function initialsFromName(name) {
  const clean = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!clean.length) return '?';
  if (clean.length === 1) return clean[0].slice(0, 2).toUpperCase();
  return (clean[0][0] + clean[1][0]).toUpperCase();
}

function makeAvatar(name, cls='avatar') {
  const el = document.createElement('div');
  el.className = cls;
  el.setAttribute('aria-label', name || 'Avatar');
  el.title = name || '';
  el.textContent = initialsFromName(name);
  return el;
}

function makeImageOrAvatar(src, name, cls="avatar") {
  if (!src) return makeAvatar(name, cls);

  const img = document.createElement("img");
  img.className = cls;
  img.src = src;
  img.alt = name || "Imagen";
  img.title = name || "";

  img.onerror = () => {
    img.replaceWith(makeAvatar(name, cls));
  };

  return img;
}

  <script>
// === Helpers ===
const $ = (s, ctx=document) => ctx.querySelector(s);
const $$ = (s, ctx=document) => Array.from(ctx.querySelectorAll(s));
const norm = s => (s||"").toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

// Persisted theme
const THEME_KEY = "ef_theme";

// Format numbers: 1.2K / 3.4M / 5.6B
function formatNumber(num) {
  if (num === "???" || Number.isNaN(num)) return "???";
  if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
  if (num >= 1e9)  return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (num >= 1e6)  return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (num >= 1e3)  return (num / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return num;
}



function getTier(strength) {
  if (strength === "???") return { label:"???", color:"#b6b6c8", cls:"unknown" };
  if (strength >= 1e10) return { label:"Dios", color:"#c084fc", cls:"god" };
  if (strength >= 1e9) return { label:"Cataclismo", color:"#ff3b3b", cls:"cataclysm" };
  if (strength >= 1e8) return { label:"Monstruo", color:"#ffd86b", cls:"monster" };
  if (strength >= 1e7) return { label:"Élite", color:"#7CFF6B", cls:"elite" };
  if (strength >= 1e6) return { label:"Combatiente", color:"#00f5ff", cls:"fighter" };
  return { label:"Bajo", color:"#8bb996", cls:"low" };
}

function strongestKnown(list, limit=5) {
  return [...list]
    .filter(c => typeof c.strength === "number" && c.strength > 0)
    .sort((a,b) => b.strength - a.strength)
    .slice(0, limit);
}

// Clean & normalize original data once
function normalizeData(list) {
  return list.map(c => {
    const cc = { ...c };
    const parsed = parseInt(String(cc.strength).replace(/\./g, ""));
    cc.strength = isNaN(parsed) ? "???" : parsed;
    if (Array.isArray(cc.transformations)) {
      cc.transformations = cc.transformations.map(t => {
        const tt = { ...t };
        const pt = parseInt(String(tt.strength).replace(/\./g, ""));
        tt.strength = isNaN(pt) ? "???" : pt;
        return tt;
      });
    }
    return cc;
  });
}

let DATA = normalizeData(characters);
let FILTERED = [...DATA];
let shownCount = 20;

// === UI wiring ===
const searchInput = $("#global-search");
const clearBtn = $("#clear-search");
const chipsWrap = $("#range-chips");
const sortSelect = $("#sort-select");
const hideUnknownPower = $("#hide-unknown-power");
const statsBar = $("#stats-bar");
const topThreats = $("#top-threats");
const toTop = $("#scroll-top");
const collapseAllBtn = $("#collapse-all");

// Theme
const themeBtn = $("#theme-toggle");
function setTheme(mode){
  const body = document.body;
  body.classList.remove("light-mode","dark-mode");
  body.classList.add(mode);
  themeBtn.setAttribute("aria-pressed", mode==="dark-mode" ? "true":"false");
  themeBtn.textContent = mode==="dark-mode" ? "☀️" : "🌙";
  try { localStorage.setItem(THEME_KEY, mode); } catch(e){}
}
function toggleTheme(){
  const isDark = document.body.classList.contains("dark-mode");
  setTheme(isDark ? "light-mode" : "dark-mode");
}
themeBtn?.addEventListener("click", toggleTheme);
(() => {
  const saved = (localStorage.getItem(THEME_KEY)||"").trim();
  if (saved==="dark-mode"||saved==="light-mode") setTheme(saved); else setTheme("dark-mode");
})();

// Search & filter state
const activeRanges = new Set();
let hideUnknownPowerEnabled = false;

function inRange(val, rangeKey) {
  if (val === "???") return rangeKey==="unknown";
  const n = val;
  switch(rangeKey){
    case "lt1m": return n < 1e6;
    case "1to10": return n >= 1e6 && n < 1e7;
    case "10to100": return n >= 1e7 && n < 1e8;
    case "100plus": return n >= 1e8;
    case "unknown": return false; // handled above
  }
  return true;
}

function runSearchAndFilter(){
  const q = norm(searchInput?.value || "");
  FILTERED = DATA.filter(c => {
    // name or transformations match?
    const baseText = c.name + " " + (Array.isArray(c.transformations) ? c.transformations.map(t=>t.name).join(" ") : "");
    const hay = norm(baseText);
    const hit = !q || hay.includes(q);

    // hide characters without established power
    const hasKnownPower = typeof c.strength === "number" && c.strength > 0;
    const knownPowerOk = !hideUnknownPowerEnabled || hasKnownPower;

    // range chips
    let rangeOk = true;
    if (activeRanges.size>0) {
      let ok = false;
      for (const key of activeRanges) {
        if (key==="unknown") {
          if (c.strength==="???") { ok = true; break; }
        } else if (inRange(c.strength, key)) { ok = true; break; }
      }
      rangeOk = ok;
    }
    return hit && knownPowerOk && rangeOk;
  });

  // sort
  if (sortSelect.value==="az") {
    FILTERED.sort((a,b)=> a.name.localeCompare(b.name));
  } else {
    // strength desc, "???" at the end
    FILTERED.sort((a,b)=> (b.strength==="???")-(a.strength==="???") || (b.strength||0) - (a.strength||0));
  }

  shownCount = 20;
  renderList();
  renderTopThreats();
  renderScale();
  updateStats();
}

searchInput?.addEventListener("input", runSearchAndFilter);
clearBtn?.addEventListener("click", ()=>{ searchInput.value=""; runSearchAndFilter(); searchInput.focus(); });

// "/" to focus search, "t" to toggle theme
document.addEventListener("keydown", (e)=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if (e.key === "/" && !["input","textarea","select"].includes(tag)) { e.preventDefault(); searchInput?.focus(); }
  if (e.key.toLowerCase()==="t" && !["input","textarea","select"].includes(tag)) { e.preventDefault(); toggleTheme(); }
});

// Chips
chipsWrap?.addEventListener("click", (e)=>{
  const btn = e.target.closest(".chip");
  if (!btn) return;
  const key = btn.dataset.range;
  if (activeRanges.has(key)) {
    activeRanges.delete(key);
    btn.classList.remove("active");
    btn.setAttribute("aria-pressed","false");
  } else {
    activeRanges.add(key);
    btn.classList.add("active");
    btn.setAttribute("aria-pressed","true");
  }
  runSearchAndFilter();
});

sortSelect?.addEventListener("change", runSearchAndFilter);

hideUnknownPower?.addEventListener("change", () => {
  hideUnknownPowerEnabled = hideUnknownPower.checked;
  runSearchAndFilter();
});

// Stats
function avg(nums) {
  const arr = nums.filter(n => n!=="???");
  if (!arr.length) return 0;
  return Math.round(arr.reduce((a,b)=>a+b,0) / arr.length);
}

function updateStats(){
  const total = FILTERED.length;
  const visibleTopScale = Math.min(20, FILTERED.filter(c => c.strength!=="???").length);
  const avgPower = avg(FILTERED.map(c=>c.strength));

  statsBar.innerHTML = `
    <div class="stat">Personajes: <strong>${total}</strong></div>
    <div class="stat">En escala: <strong>${visibleTopScale}</strong></div>
    <div class="stat">Fuerza media: <strong>${formatNumber(avgPower)}</strong></div>
    <div class="badges">
      <span class="badge ok">SCOUTER OK</span>
      <span class="badge warn">${(activeRanges.size || hideUnknownPowerEnabled) ? "FILTRO ACTIVO" : "SIN FILTRO"}</span>
      <span class="badge err">??? ${FILTERED.filter(c=>c.strength==="???").length}</span>
    </div>
  `;
}


function renderTopThreats(){
  if (!topThreats) return;
  topThreats.innerHTML = "";
  const top = strongestKnown(FILTERED, 5);

  if (!top.length) {
    topThreats.innerHTML = `<div class="scale-note">No hay lecturas de poder conocidas con los filtros actuales.</div>`;
    return;
  }

  top.forEach((c, idx) => {
    const tier = getTier(c.strength);
    const card = document.createElement("article");
    card.className = `threat-card rank-${idx + 1}`;
    card.style.setProperty("--tier-color", tier.color);

    const rank = document.createElement("div");
    rank.className = "threat-rank";
    rank.textContent = `#${idx + 1}`;

    const img = makeImageOrAvatar(c.photo, c.name, "avatar");
    const name = document.createElement("div");
    name.className = "threat-name";
    name.textContent = c.name;

    const power = document.createElement("div");
    power.className = "threat-power";
    power.textContent = `${formatNumber(c.strength)} · ${tier.label}`;

    card.append(rank, img, name, power);
    topThreats.appendChild(card);
  });
}

// Render list
function renderList(){
  const ul = $("#character-list");
  ul.innerHTML = "";

  FILTERED.slice(0, shownCount).forEach(character => {
    const li = document.createElement("li");
    const tier = getTier(character.strength);
    li.className = `character-item ${character.strength === "???" ? "unknown-card" : ""}`;
    li.style.setProperty("--tier-color", tier.color);

    const img = makeImageOrAvatar(character.photo, character.name, "avatar");

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `
      <div class="name">${character.name}</div>
      <div class="power">Lectura: ${character.strength==="???" ? "???" : formatNumber(character.strength)}</div>
      <div class="tier-badge" style="--tier-color:${tier.color}">${tier.label}</div>
    `;

    const actions = document.createElement("div");
    actions.className = "actions";

    // Transformations
    if (Array.isArray(character.transformations) && character.transformations.length) {
      const toggle = document.createElement("button");
      toggle.textContent = "Desbloquear formas";
      toggle.className = "toggle-button";

      const tContainer = document.createElement("div");
      tContainer.className = "transformation hidden";

      character.transformations.forEach(t => {
        const tDiv = document.createElement("div");
        tDiv.className = "transformation-item";
        const tImg = makeImageOrAvatar(t.photo, t.name, "avatar");
        const tMeta = document.createElement("div");
        
let multiplierText = "";

if (character.strength !== "???" && t.strength !== "???") {
  const mult = t.strength / character.strength;

  let hue = 200;
  let glow = "";

  if (mult >= 50) { hue = 55; glow = "glow"; }
  else if (mult >= 25) hue = 280;
  else if (mult >= 10) hue = 200;
  else if (mult >= 5) hue = 180;
  else hue = 0;

  const color = `hsl(${hue}, 90%, 60%)`;

  multiplierText = `<span class="multiplier ${glow}" style="color:${color}; border:1px solid ${color};">
    x${mult.toFixed(1)}
  </span>`;
}

tMeta.innerHTML = `
  <strong>${t.name}</strong> — 
  ${t.strength==="???" ? "Fuerza: ???" : "Fuerza: " + formatNumber(t.strength)}
  ${multiplierText}
`;

        tDiv.appendChild(tImg); tDiv.appendChild(tMeta);
        tContainer.appendChild(tDiv);
      });

      toggle.onclick = () => {
        tContainer.classList.toggle("hidden");
        toggle.textContent = tContainer.classList.contains("hidden") ? "Desbloquear formas" : "Bloquear formas";
      };

      actions.appendChild(toggle);
      li.appendChild(img); li.appendChild(meta); li.appendChild(actions); li.appendChild(tContainer);
    } else {
      li.appendChild(img); li.appendChild(meta);
    }

    ul.appendChild(li);
  });

  if (shownCount < FILTERED.length) {
    const btn = document.createElement("button");
    btn.textContent = "Mostrar más";
    btn.onclick = () => { shownCount += 20; renderList(); };
    ul.appendChild(btn);
  }
}

// Render scale (top 20 by current order, ignoring strength "???")
function renderScale() {
  const rail = document.querySelector(".power-rail");
  if (!rail) return;

  rail.querySelectorAll(".power-node").forEach(n => n.remove());

  const visible = FILTERED
    .filter(c => typeof c.strength === "number" && c.strength > 0)
    .slice(0, 20);

  if (!visible.length) return;

  // Escala logarítmica
  const values = visible.map(c => c.strength);
  const min = Math.min(...values);
  const max = Math.max(...values);

  const logMin = Math.log10(min);
  const logMax = Math.log10(max);

  visible.forEach(c => {
    const logVal = Math.log10(c.strength);
    const percent =
      ((logVal - logMin) / (logMax - logMin)) * 100;

    const node = document.createElement("div");
    node.className = "power-node";
    node.style.left = `${percent}%`;
    node.title = `${c.name} — ${formatNumber(c.strength)}`;

    const avatar = makeImageOrAvatar(c.photo, c.name, "power-avatar");

    node.appendChild(avatar);
    rail.appendChild(node);
  });
}


// Collapse-all transformations
collapseAllBtn?.addEventListener("click", ()=>{
  $$(".transformation").forEach(t => t.classList.add("hidden"));
  $$(".toggle-button").forEach(btn => btn.textContent = "Desbloquear formas");
});

window.addEventListener("scroll", ()=>{

runSearchAndFilter();
