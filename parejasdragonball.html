<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Árbol Familiar — Lista Oscura</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;500;600;700&display=swap');

    :root{
      --bg:#080512;
      --bg-2:#140915;
      --panel:rgba(20,18,28,.88);
      --panel-2:rgba(31,27,42,.9);
      --panel-3:rgba(48,35,48,.94);
      --border:rgba(255,194,64,.16);
      --border-strong:rgba(255,220,112,.34);
      --text:#fff6df;
      --muted:#e7b979;
      --accent:#ffb000;
      --accent2:#ff4b1f;
      --accent3:#36a7ff;
      --shadow:0 22px 70px rgba(0,0,0,.55), 0 0 34px rgba(255,124,23,.10);
      --radius:22px;
      --chipS:#38e07b;
      --chipL:#3eb7ff;
      --chipY:#ffb020;
      --chipQ:#c2b8a4;
      --font:'Rajdhani', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      --mono:'Rajdhani', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --display:'Bangers', Impact, fantasy;
      --header-h: 88px;
    }

    .light{
      --bg:#ffe8aa;
      --bg-2:#ffcf70;
      --panel:rgba(255,250,224,.88);
      --panel-2:rgba(255,242,194,.92);
      --panel-3:rgba(255,222,142,.94);
      --border:rgba(110,55,0,.16);
      --border-strong:rgba(110,55,0,.30);
      --text:#271000;
      --muted:#7b4812;
      --shadow:0 18px 50px rgba(134,61,0,.18), 0 0 28px rgba(255,117,24,.12);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      letter-spacing:.015em;
      background:
        radial-gradient(circle at 18% 16%, rgba(255,186,40,.24), transparent 19%),
        radial-gradient(circle at 84% 8%, rgba(33,153,255,.18), transparent 22%),
        radial-gradient(circle at 78% 74%, rgba(255,75,31,.18), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg-2) 48%, #05030b 100%);
      overflow-x:hidden;
      position:relative;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-120px;
      pointer-events:none;
      z-index:-2;
      background:
        repeating-linear-gradient(115deg, rgba(255,255,255,.045) 0 1px, transparent 1px 58px),
        radial-gradient(circle at center, transparent 0 34%, rgba(0,0,0,.38) 78%);
      animation:bg-pan 18s linear infinite;
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      background:
        linear-gradient(90deg, transparent 0 49%, rgba(255,177,0,.06) 50%, transparent 51%),
        repeating-radial-gradient(circle at 50% 20%, rgba(255,184,42,.07) 0 2px, transparent 2px 18px);
      mix-blend-mode:screen;
      opacity:.7;
    }

    @keyframes bg-pan{to{transform:translate3d(46px, -22px, 0)}}

    a{color:inherit}
    .container{max-width:1360px; margin:0 auto; padding:20px 16px 86px}

    header{
      position:sticky;
      top:0;
      z-index:100;
      backdrop-filter:blur(18px) saturate(1.2);
      background:linear-gradient(180deg, color-mix(in srgb, var(--bg) 88%, transparent), color-mix(in srgb, var(--bg-2) 72%, transparent));
      border-bottom:2px solid color-mix(in srgb, var(--accent) 34%, transparent);
      box-shadow:0 12px 34px rgba(0,0,0,.28), inset 0 -1px rgba(255,255,255,.06);
    }

    .header-inner{
      max-width:1360px;
      margin:0 auto;
      padding:14px 16px;
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .brand{display:flex; flex-direction:column; gap:4px; position:relative}
    .brand h1{
      margin:0;
      font-family:var(--display);
      font-size:clamp(1.8rem, 3.6vw, 3.2rem);
      line-height:.92;
      letter-spacing:1px;
      color:#fff7d5;
      text-shadow:3px 3px 0 #9a270e, 6px 6px 0 rgba(0,0,0,.45), 0 0 22px rgba(255,181,32,.38);
      transform:skew(-3deg);
    }
    .brand .sub{margin:0; color:var(--muted); font-size:1rem; font-weight:700}
    .brand .tagline{
      display:inline-flex; align-items:center; gap:10px;
      width:max-content;
      font:900 .82rem var(--mono);
      letter-spacing:1.4px; color:#ffd37a;
      text-transform:uppercase;
      padding:5px 10px;
      border:1px solid rgba(255,183,31,.24);
      border-radius:999px;
      background:rgba(255,176,0,.08);
    }

    .dot{
      width:10px; height:10px; border-radius:999px;
      background:radial-gradient(circle at 35% 35%, #fff, var(--accent) 32%, var(--accent2));
      box-shadow:0 0 16px var(--accent), 0 0 32px rgba(255,75,31,.55);
    }

    .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .search{position:relative; min-width:260px; flex:1 1 340px}
    .search input{
      width:100%;
      padding:12px 42px 12px 42px;
      border-radius:999px;
      outline:none;
      border:2px solid var(--border);
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 92%, transparent), color-mix(in srgb, var(--panel) 94%, transparent));
      color:var(--text);
      box-shadow:inset 0 2px 0 rgba(255,255,255,.05), 0 12px 24px rgba(0,0,0,.22);
      font-weight:700;
    }
    .search input::placeholder{color:color-mix(in srgb, var(--muted) 78%, transparent)}
    .search input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(255,176,0,.16), 0 0 28px rgba(255,100,20,.22);
    }
    .search .icon{
      position:absolute; left:14px; top:50%;
      transform:translateY(-50%);
      color:var(--accent);
      pointer-events:none;
    }
    .search .clear{
      position:absolute; right:12px; top:50%;
      transform:translateY(-50%);
      border:0; background:transparent; color:var(--muted); cursor:pointer;
      font-size:18px; padding:4px; line-height:1; visibility:hidden;
    }

    .group{
      display:flex; gap:8px; align-items:center; flex-wrap:wrap;
      padding:6px;
      border:2px solid var(--border);
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      border-radius:18px;
      box-shadow:inset 0 1px rgba(255,255,255,.06);
    }
    .group .label{
      font:900 .72rem var(--mono);
      letter-spacing:1.1px;
      color:var(--accent);
      padding:0 7px;
      text-transform:uppercase;
    }

    .btn{
      border:2px solid var(--border);
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel-3) 84%, transparent), color-mix(in srgb, var(--panel-2) 92%, transparent));
      color:var(--text);
      padding:9px 13px;
      border-radius:14px;
      cursor:pointer;
      user-select:none;
      font-weight:900;
      letter-spacing:.04em;
      transition:transform .12s ease, border-color .2s, box-shadow .2s, background .2s, filter .2s;
      box-shadow:0 9px 0 rgba(0,0,0,.22), 0 14px 24px rgba(0,0,0,.22);
    }
    .btn:hover{
      border-color:var(--accent);
      background:linear-gradient(180deg, rgba(255,176,0,.18), var(--panel-3));
      filter:saturate(1.12);
      transform:translateY(-2px);
      box-shadow:0 11px 0 rgba(0,0,0,.22), 0 0 26px rgba(255,148,35,.18);
    }
    .btn:active{transform:translateY(2px); box-shadow:0 5px 0 rgba(0,0,0,.22)}
    .btn[aria-pressed="true"]{
      border-color:#ffd45f;
      background:linear-gradient(180deg, #ffd45f, #ff8c1a 55%, #d73b16);
      color:#230b00;
      box-shadow:0 0 0 4px rgba(255,208,73,.16), 0 0 30px rgba(255,118,24,.36), 0 7px 0 rgba(94,28,0,.55);
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0, 1fr) 320px;
      gap:22px;
      align-items:start;
    }

    .panel{
      border:2px solid var(--border);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--panel) 92%, transparent), color-mix(in srgb, var(--panel-2) 94%, transparent)),
        radial-gradient(circle at 0 0, rgba(255,176,0,.12), transparent 44%);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .panel::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      border-radius:inherit;
      background:linear-gradient(135deg, rgba(255,255,255,.12), transparent 28%, rgba(255,176,0,.07) 58%, transparent 78%);
      opacity:.55;
    }

    .sidebar{
      position:sticky;
      top:calc(var(--header-h) + 12px);
      align-self:start;
      padding:16px;
    }

    .sidebar-head{margin-bottom:12px}
    .sidebar-toggle{
      width:100%;
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      border:2px solid var(--border);
      border-radius:16px;
      background:var(--panel-2);
      color:var(--text);
      cursor:pointer;
      font:900 .95rem var(--font);
      text-align:left;
    }
    .sidebar-toggle:hover{background:var(--panel-3); border-color:var(--accent)}
    .toggle-icon{transition:transform .2s ease}
    .sidebar-toggle[aria-expanded="true"] .toggle-icon{transform:rotate(180deg)}
    .sidebar-content{display:block; position:relative; z-index:1}

    .legend{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 14px}
    .chip{
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 11px;
      border-radius:999px;
      border:1px solid var(--border-strong);
      background:rgba(0,0,0,.18);
      font-size:.9rem;
      font-weight:800;
    }

    .c-dot{width:10px; height:10px; border-radius:999px; box-shadow:0 0 14px currentColor}
    .c-dot.S{background:var(--chipS); color:var(--chipS)}
    .c-dot.L{background:var(--chipL); color:var(--chipL)}
    .c-dot.Y{background:var(--chipY); color:var(--chipY)}
    .c-dot.Q{background:var(--chipQ); color:var(--chipQ)}

    .index-wrap{max-height:calc(100vh - var(--header-h) - 140px); overflow:auto; padding-right:4px; overscroll-behavior:contain}
    .index{margin:0; padding:0; list-style:none; display:grid; gap:8px}
    .index a{
      display:block;
      text-decoration:none;
      padding:11px 13px;
      border-radius:14px;
      border:1px solid var(--border);
      background:linear-gradient(90deg, rgba(255,176,0,.08), rgba(54,167,255,.06));
      color:var(--text);
      font-weight:800;
      transition:border-color .2s, transform .12s ease, background .2s, box-shadow .2s;
    }
    .index a:hover{border-color:var(--accent); background:rgba(255,176,0,.14); transform:translateX(3px); box-shadow:0 0 18px rgba(255,176,0,.14)}
    .emptyNote{color:var(--muted); font-style:italic; margin:8px 0 0; font-weight:700}

    .results{padding:14px; margin-bottom:16px}
    .results.hidden{display:none}
    .results .title{color:var(--accent); font-weight:900; text-transform:uppercase; letter-spacing:1px; font-size:.92rem; margin-bottom:10px}
    .strip{display:grid; grid-template-columns:1fr; gap:10px}

    .families{display:flex; flex-direction:column; gap:18px; min-width:0}
    .family{padding:16px; scroll-margin-top:calc(var(--header-h) + 18px)}
    .family.hidden{display:none !important}

    .family-header{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      padding-bottom:14px;
      border-bottom:2px solid color-mix(in srgb, var(--accent) 20%, transparent);
      margin-bottom:14px;
      position:relative;
      z-index:1;
    }

    .parents{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
    .avatar, .card-media, .m-media-box{
      display:grid;
      place-items:center;
      text-align:center;
      border:2px solid var(--border-strong);
      background:
        radial-gradient(circle at 50% 20%, rgba(255,228,120,.22), transparent 48%),
        linear-gradient(135deg, rgba(255,176,0,.18), rgba(255,75,31,.14) 52%, rgba(54,167,255,.12)),
        var(--panel-3);
      color:var(--text);
      font-weight:900;
      letter-spacing:.04em;
      box-shadow:inset 0 1px rgba(255,255,255,.12), 0 0 20px rgba(255,176,0,.10);
    }

    .avatar{
      width:56px;
      height:56px;
      border-radius:18px;
      font-size:.76rem;
      padding:4px;
      overflow:hidden;
      position:relative;
      flex:0 0 auto;
      transform:skew(-4deg);
    }
    .avatar:hover{box-shadow:0 0 0 3px rgba(255,176,0,.18), 0 0 24px rgba(255,176,0,.28)}
    .avatar.has-img, .card-media.has-img, .m-media-box.has-img{padding:0; background:var(--panel-3)}
    .avatar-img, .card-img, .modal-img{width:100%; height:100%; object-fit:cover; display:block}
    .avatar-img{border-radius:inherit; transform:skew(4deg) scale(1.08)}

    .family-title{
      margin:0;
      font-family:var(--display);
      font-size:clamp(1.45rem, 2.6vw, 2.25rem);
      line-height:.95;
      letter-spacing:1px;
      color:#ffe66d;
      text-shadow:2px 2px 0 #7d230c, 4px 4px 0 rgba(0,0,0,.5), 0 0 18px rgba(255,176,0,.28);
      transform:skew(-4deg);
    }

    .children{display:grid; grid-template-columns:1fr; gap:11px; position:relative; z-index:1}
    .card{
      border:2px solid var(--border);
      background:
        linear-gradient(90deg, rgba(255,176,0,.10), rgba(255,255,255,.02) 32%, rgba(54,167,255,.08)),
        var(--panel-2);
      border-radius:18px;
      padding:12px 14px;
      display:grid;
      grid-template-columns:96px minmax(0,1fr) auto;
      gap:15px;
      align-items:center;
      cursor:pointer;
      transition:transform .12s ease, border-color .2s, box-shadow .2s, background .2s, filter .2s;
      outline:none;
      position:relative;
      overflow:hidden;
    }
    .card::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(120deg, transparent 0 38%, rgba(255,255,255,.10) 45%, transparent 52%);
      transform:translateX(-120%);
      transition:transform .55s ease;
    }
    .card:hover{
      transform:translateY(-3px) scale(1.006);
      background:linear-gradient(90deg, rgba(255,176,0,.18), rgba(255,255,255,.03) 38%, rgba(54,167,255,.13)), var(--panel-3);
      border-color:var(--accent);
      box-shadow:0 16px 38px rgba(0,0,0,.32), 0 0 30px rgba(255,132,28,.22);
      filter:saturate(1.08);
    }
    .card:hover::after{transform:translateX(120%)}
    .card:focus-visible{border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,176,0,.18), 0 0 30px rgba(255,124,20,.26)}
    .card.hidden{display:none !important}

    .card-media{
      width:96px;
      height:96px;
      min-height:96px;
      border-radius:16px;
      padding:10px;
      font-size:.95rem;
      line-height:1.15;
      overflow:hidden;
      overflow-wrap:anywhere;
      position:relative;
    }
    .card-media::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:radial-gradient(circle at 50% 50%, transparent 46%, rgba(255,176,0,.20));
      opacity:.9;
    }

    .card-main{min-width:0; display:flex; flex-direction:column; gap:6px}
    .card h3{margin:0; font-size:1.14rem; line-height:1.1; overflow-wrap:anywhere; font-weight:900; color:#fff7d7}
    .card p{margin:0; color:var(--muted); font-size:.96rem; overflow-wrap:anywhere; font-weight:700}
    .card-side{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end}

    .kid-num{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:32px;
      height:32px;
      padding:0 9px;
      border-radius:999px;
      border:1px solid var(--border-strong);
      background:rgba(0,0,0,.24);
      font:900 .8rem var(--mono);
      color:#ffe66d;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:36px;
      height:36px;
      padding:0 11px;
      border-radius:999px;
      font:900 .82rem var(--mono);
      color:#08111f;
      border:2px solid rgba(255,255,255,.32);
      box-shadow:0 0 18px currentColor;
    }
    .badge.S{background:var(--chipS); color:#0b2a16}
    .badge.L{background:var(--chipL); color:#061a2a}
    .badge.Y{background:var(--chipY); color:#2a1300}
    .badge.Q{background:var(--chipQ); color:#16110c}

    footer{
      max-width:1360px;
      margin:0 auto;
      padding:18px 16px 40px;
      color:var(--muted);
      font-size:.95rem;
      font-weight:700;
      text-align:center;
    }

    dialog{
      width:min(780px, 92vw);
      border:2px solid var(--border-strong);
      border-radius:22px;
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 96%, var(--bg)), color-mix(in srgb, var(--panel-2) 94%, var(--bg)));
      color:var(--text);
      padding:0;
      box-shadow:0 28px 90px rgba(0,0,0,.66), 0 0 46px rgba(255,124,24,.24);
      overflow:hidden;
    }
    dialog::backdrop{background:radial-gradient(circle at center, rgba(255,176,0,.14), rgba(0,0,0,.78) 62%); backdrop-filter:blur(5px)}

    .modal-wrap{display:grid; grid-template-columns:230px 1fr; gap:16px; padding:16px; position:relative; z-index:1}
    .m-media-box{
      width:100%;
      height:270px;
      min-height:220px;
      border-radius:16px;
      padding:18px;
      font-size:1.12rem;
      line-height:1.25;
      overflow:hidden;
      overflow-wrap:anywhere;
    }
    .m-body{display:flex; flex-direction:column; gap:9px; min-width:0; justify-content:center}
    .m-title{
      margin:0;
      overflow-wrap:anywhere;
      font-family:var(--display);
      font-size:clamp(1.8rem, 4vw, 3rem);
      line-height:.95;
      color:#ffe66d;
      text-shadow:2px 2px 0 #7d230c, 4px 4px 0 rgba(0,0,0,.45);
    }
    .m-meta{margin:0; color:var(--muted); overflow-wrap:anywhere; font-weight:800; font-size:1.05rem}
    .m-actions{display:flex; justify-content:flex-end; gap:10px; padding:0 16px 16px; flex-wrap:wrap}

    .link{
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 15px;
      border-radius:14px;
      border:2px solid var(--border);
      background:var(--panel-2);
      color:var(--text);
      cursor:pointer;
      font-weight:900;
      box-shadow:0 8px 0 rgba(0,0,0,.22);
    }
    .link.primary{
      border-color:rgba(255,213,95,.55);
      background:linear-gradient(180deg, rgba(255,211,95,.96), rgba(255,142,26,.96));
      color:#230b00;
    }
    .link:hover{transform:translateY(-1px); filter:saturate(1.08)}
    .link:active{transform:translateY(2px); box-shadow:0 4px 0 rgba(0,0,0,.22)}
    .link[aria-disabled="true"]{opacity:.55; pointer-events:none; cursor:not-allowed}

    @media (min-width: 981px){
      .sidebar-toggle{display:none}
      .sidebar-content{display:block !important}
    }

    @media (max-width: 980px){
      :root{ --header-h: 132px; }
      .layout{grid-template-columns:1fr}
      .sidebar{order:-1; position:static; top:auto; padding:14px}
      .sidebar-head{margin-bottom:0}
      .sidebar-toggle{display:flex}
      .sidebar-content{display:none !important; margin-top:12px}
      .sidebar.open .sidebar-content{display:block !important}
      .index-wrap{max-height:260px; overflow:auto}
    }

    @media (max-width: 780px){
      :root{ --header-h: 200px; }
      .container{padding:14px 12px 60px}
      .controls{width:100%}
      .search{min-width:100%}
      .group{width:100%; justify-content:flex-start}
      .sidebar{padding:14px; border-radius:18px}
      .legend{display:grid; grid-template-columns:1fr 1fr}
      .card{grid-template-columns:76px minmax(0,1fr); align-items:start}
      .card-media{width:76px; height:76px; min-height:76px; font-size:.85rem}
      .card-side{grid-column:1 / -1; justify-content:flex-start}
      .modal-wrap{grid-template-columns:1fr}
      .m-media-box{min-height:150px}
    }

    @media (max-width: 480px){
      :root{ --header-h: 230px; }
      .header-inner{padding:12px}
      .brand h1{font-size:1.85rem}
      .brand .sub{font-size:.9rem}
      .btn{padding:9px 10px}
      .legend{grid-template-columns:1fr}
      .family{padding:12px}
      .family-header{align-items:flex-start}
      .avatar{width:44px; height:44px; font-size:.68rem}
      .card{padding:10px; gap:10px}
    }

  </style>
</head>
<body>
  <header id="siteHeader">
    <div class="header-inner">
      <div class="brand">
        <div class="tagline"><span class="dot"></span> FAMILIAS / DRAGON BALL</div>
        <h1>Árbol Familiar</h1>
        <p class="sub">Si lees esto, te quiero, guapo.</p>
      </div>

      <div class="controls">
        <div class="search" role="search">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>

    const familiesEl = document.getElementById('families');

    const siteHeader = document.getElementById('siteHeader');

    const familySidebar = document.getElementById('familySidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');

    function setMobileSidebarState(open){
      const isMobile = window.innerWidth <= 980;

      if(!isMobile){
        familySidebar.classList.remove('open');
        sidebarToggle.setAttribute('aria-expanded', 'true');
        return;
      }

      familySidebar.classList.toggle('open', open);
      sidebarToggle.setAttribute('aria-expanded', String(open));
    }

    function updateHeaderHeight(){
      const h = siteHeader.offsetHeight || 88;
      document.documentElement.style.setProperty('--header-h', `${h}px`);
    }

    function normalize(s){
      return (s || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .toLowerCase()
        .trim();
    }

    function slugify(title){
      return normalize(title).replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    }

    function escapeHTML(str){
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function initials(name){
      const clean = (name || '??').replace(/[^\p{L}\p{N}\s?]/gu,' ').trim();
      if(clean === '???') return '???';
      const parts = clean.split(/\s+/).filter(Boolean);
      return parts.slice(0,2).map(p => p[0]?.toUpperCase() || '').join('') || '??';
    }

    function genderMark(g){
      return g === 'F' ? '♀️' : g === 'M' ? '♂️' : '❔';
    }

    function tagClass(t){
      return t === 'S' ? 'S' : t === 'L' ? 'L' : t === 'Y' ? 'Y' : 'Q';
    }

    function isValidLink(link){
      return typeof link === 'string' && link.trim() !== '' && link.trim() !== '#';
    }

    function isValidImage(src){
      return typeof src === 'string' && src.trim() !== '';
    }

    function imageOrFallback(src, alt, fallbackHTML, className){
      if(isValidImage(src)){
        return `<img class="${className}" src="${escapeHTML(src)}" alt="${escapeHTML(alt)}" loading="lazy" onerror="this.parentElement.classList.remove('has-img'); this.remove();">`;
      }

      return fallbackHTML;
    }

    function renderFamilies(){
      familiesEl.innerHTML = '';

      DATA.forEach((fam, i) => {
        const section = document.createElement('section');
        section.className = 'panel family';
        section.dataset.title = fam.family;
        section.id = slugify(fam.family) || `familia-${i+1}`;

        section.innerHTML = `
          <div class="family-header">
            <div class="parents">
              ${fam.parents.map(parent => {
                const parentObj = typeof parent === 'string' ? { name: parent, img: '' } : parent;
                const parentName = parentObj.name || '???';
                const parentImg = parentObj.img || '';
                return `<div class="avatar ${isValidImage(parentImg) ? 'has-img' : ''}" title="${escapeHTML(parentName)}">${imageOrFallback(parentImg, parentName, escapeHTML(initials(parentName)), 'avatar-img')}</div>`;
              }).join('')}
            </div>
            <h2 class="family-title">${escapeHTML(fam.family)}</h2>
          </div>

          <div class="children">
            ${fam.children.map((kid, idx) => `
              <article
                class="card"
                tabindex="0"
                role="button"
                aria-label="Abrir ficha de ${escapeHTML(kid.name)}"
                data-name="${escapeHTML(kid.name)}"
                data-series="${escapeHTML(kid.series)}"
                data-gender="${escapeHTML(kid.gender)}"
                data-tag="${escapeHTML(kid.tag)}"
                data-link="${escapeHTML(kid.link)}"
              >
                <div class="card-media ${isValidImage(kid.img) ? 'has-img' : ''}">
                  ${imageOrFallback(
                    kid.img,
                    kid.name,
                    `${escapeHTML(initials(kid.name))}<br><small>${escapeHTML(kid.series || 'Sin serie')}</small>`,
                    'card-img'
                  )}
                </div>

                <div class="card-main">
                  <h3>${escapeHTML(genderMark(kid.gender) + ' ' + kid.name)}</h3>
                  <p>${escapeHTML(kid.meta)}</p>
                </div>

                <div class="card-side">
                  <span class="kid-num">${idx + 1}</span>
                  <span class="badge ${tagClass(kid.tag)}" title="Etiqueta: ${escapeHTML(kid.tag)}">${escapeHTML(kid.tag)}</span>
                </div>
              </article>
            `).join('')}
          </div>
        `;

        familiesEl.appendChild(section);
      });

      rebuildIndex();
      apply();
      updateHeaderHeight();
    }

    function rebuildIndex(){
      const visibleFamilies = [...document.querySelectorAll('section.family:not(.hidden)')];
      indexList.innerHTML = '';

      visibleFamilies.forEach((sec, i) => {
        const title = sec.dataset.title || `Familia ${i + 1}`;
        if(!sec.id) sec.id = slugify(title) || `familia-${i + 1}`;

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `#${sec.id}`;
        a.textContent = title;

        a.addEventListener('click', () => {
          if(window.innerWidth <= 980){
            setMobileSidebarState(false);
          }
        });

        li.appendChild(a);
        indexList.appendChild(li);
      });

      noFamiliesMsg.style.display = visibleFamilies.length ? 'none' : '';
    }

    const themeBtn = document.getElementById('theme');
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    const storedTheme = localStorage.getItem('dbmin-theme');

    if(storedTheme === 'light' || (!storedTheme && prefersLight)){
      document.documentElement.classList.add('light');
    }

    updateThemeButton();

    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('light');
      localStorage.setItem('dbmin-theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
      updateThemeButton();
    });

    function updateThemeButton(){
      const isLight = document.documentElement.classList.contains('light');
      themeBtn.setAttribute('aria-pressed', String(isLight));
      themeBtn.textContent = isLight ? '🌙 Cambiar a oscuro' : '☀️ Cambiar a claro';
    }

    const q = document.getElementById('q');
    const clear = document.getElementById('clear');
    const results = document.getElementById('results');
    const resultsStrip = document.getElementById('resultsStrip');
    const tagBtns = [...document.querySelectorAll('[data-filter-tag]')];
    const genderBtns = [...document.querySelectorAll('[data-filter-gender]')];

    const state = {
      term: '',
      tags: new Set(),
      genders: new Set()
    };

    function toggleBtn(btn){
      const pressed = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', String(!pressed));
    }

    function apply(){
      const nterm = normalize(state.term);
      const familySections = [...document.querySelectorAll('section.family')];
      const cards = [...document.querySelectorAll('.card')];
      const hits = [];

      cards.forEach(card => {
        const name = normalize(card.dataset.name);
        const series = normalize(card.dataset.series);
        const meta = normalize(card.querySelector('p')?.textContent || '');
        const tag = card.dataset.tag || '?';
        const gender = card.dataset.gender || '?';

        const termOk = !nterm || name.includes(nterm) || series.includes(nterm) || meta.includes(nterm);
        const tagOk = state.tags.size === 0 || state.tags.has(tag);
        const genOk = state.genders.size === 0 || state.genders.has(gender);
        const visible = termOk && tagOk && genOk;

        card.classList.toggle('hidden', !visible);

        if(visible && nterm){
          hits.push(card);
        }
      });

      familySections.forEach(sec => {
        const anyVisible = [...sec.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
        sec.classList.toggle('hidden', !anyVisible);
      });

      rebuildIndex();

      resultsStrip.innerHTML = '';

      if(nterm){
        results.classList.remove('hidden');

        hits.slice(0, 24).forEach(card => {
          const clone = card.cloneNode(true);
          clone.classList.remove('hidden');
          resultsStrip.appendChild(clone);
        });

        if(hits.length === 0){
          const empty = document.createElement('div');
          empty.className = 'emptyNote';
          empty.textContent = 'No hay coincidencias.';
          resultsStrip.appendChild(empty);
        }
      } else {
        results.classList.add('hidden');
      }
    }

    let tId = null;

    q.addEventListener('input', () => {
      state.term = q.value;
      clear.style.visibility = q.value ? 'visible' : 'hidden';
      clearTimeout(tId);
      tId = setTimeout(apply, 100);
    });

    clear.addEventListener('click', () => {
      q.value = '';
      state.term = '';
      clear.style.visibility = 'hidden';
      q.focus();
      apply();
    });

    window.addEventListener('keydown', e => {
      if(e.key === '/' && document.activeElement !== q){
        e.preventDefault();
        q.focus();
      }
    });

    tagBtns.forEach(btn => btn.addEventListener('click', () => {
      const tag = btn.dataset.filterTag;
      toggleBtn(btn);

      if(btn.getAttribute('aria-pressed') === 'true'){
        state.tags.add(tag);
      } else {
        state.tags.delete(tag);
      }

      apply();
    }));

    genderBtns.forEach(btn => btn.addEventListener('click', () => {
      const g = btn.dataset.filterGender;
      toggleBtn(btn);

      if(btn.getAttribute('aria-pressed') === 'true'){
        state.genders.add(g);
      } else {
        state.genders.delete(g);
      }

      apply();
    }));

    document.getElementById('reset').addEventListener('click', () => {
      state.term = '';
      q.value = '';
      clear.style.visibility = 'hidden';
      state.tags.clear();
      state.genders.clear();

      [...tagBtns, ...genderBtns].forEach(b => b.setAttribute('aria-pressed', 'false'));
      apply();
    });

    const modal = document.getElementById('modal');
    const mBox = document.getElementById('mBox');
    const mTitle = document.getElementById('mTitle');
    const mMeta = document.getElementById('mMeta');
    const mLink = document.getElementById('mLink');
    const mClose = document.getElementById('mClose');

    let lastFocusedCard = null;

    function openCard(card){
      lastFocusedCard = card;

      const title = card.querySelector('h3')?.textContent || '';
      const meta = card.querySelector('p')?.textContent || '';
      const mediaHTML = card.querySelector('.card-media')?.innerHTML || '';
      const link = card.dataset.link || '#';

      mBox.innerHTML = mediaHTML;
      mTitle.textContent = title;
      mMeta.textContent = meta;

      if(isValidLink(link)){
        mLink.href = link;
        mLink.setAttribute('aria-disabled', 'false');
      } else {
        mLink.href = '#';
        mLink.setAttribute('aria-disabled', 'true');
      }

      if(typeof modal.showModal === 'function'){
        modal.showModal();
      }
    }

    function closeModal(){
      if(modal.open) modal.close();
      if(lastFocusedCard) lastFocusedCard.focus();
    }

    document.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if(!card) return;
      openCard(card);
    });

    document.addEventListener('keydown', (e) => {
      const card = document.activeElement?.closest?.('.card');

      if(card && (e.key === 'Enter' || e.key === ' ')){
        e.preventDefault();
        openCard(card);
      }

      if(e.key === 'Escape'){
        closeModal();
      }
    });

    mClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      const rect = modal.getBoundingClientRect();
      const inside =
        e.clientX >= rect.left &&
        e.clientX <= rect.right &&
        e.clientY >= rect.top &&
        e.clientY <= rect.bottom;

      if(!inside){
        closeModal();
      }
    });

    sidebarToggle.addEventListener('click', () => {
      const isOpen = familySidebar.classList.contains('open');
      setMobileSidebarState(!isOpen);
    });

    window.addEventListener('resize', () => {
      updateHeaderHeight();

      if(window.innerWidth <= 980){
        setMobileSidebarState(false);
      } else {
        setMobileSidebarState(true);
      }
    });

    window.addEventListener('load', () => {
      updateHeaderHeight();

      if(window.innerWidth <= 980){
        setMobileSidebarState(false);
      } else {
        setMobileSidebarState(true);
      }
    });

    renderFamilies();
  </script>
</body>
</html>
