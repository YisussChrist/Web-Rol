<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario de Cumpleaños y Aniversarios</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #0f172a;
      --panel: rgba(255, 255, 255, .078);
      --panel-strong: rgba(255, 255, 255, .12);
      --panel-soft: rgba(255, 255, 255, .055);
      --stroke: rgba(255, 255, 255, .16);
      --stroke-strong: rgba(255, 255, 255, .26);
      --text: #f8fafc;
      --ink: #f8fafc;
      --muted: #aab6ca;
      --muted-2: #7f8da6;
      --accent: #60a5fa;
      --accent-2: #22d3ee;

      --birthday: #f59e0b;
      --anniversary: #a78bfa;

      --db: #fb923c;
      --inazuma: #60a5fa;
      --pokemon: #ef4444;
      --other: #94a3b8;

      --shadow: 0 24px 80px rgba(0, 0, 0, .38);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --blur: blur(26px) saturate(150%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(96, 165, 250, .34), transparent 32%),
        radial-gradient(circle at 86% 14%, rgba(34, 211, 238, .22), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(167, 139, 250, .20), transparent 42%),
        linear-gradient(135deg, #08111f 0%, #0f172a 48%, #111827 100%);
      padding: 30px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255,255,255,.07), transparent 22%, transparent 74%, rgba(255,255,255,.04)),
        repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 80px),
        repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 80px);
      pointer-events: none;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    .app {
      max-width: 1680px;
      margin: 0 auto;
      position: relative;
      border-radius: var(--radius-xl);
      padding: 38px;
      background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.055));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.10);
      overflow: hidden;
      backdrop-filter: var(--blur);
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 0 0, rgba(96,165,250,.22), transparent 28%),
        radial-gradient(circle at 100% 0, rgba(34,211,238,.12), transparent 26%);
      pointer-events: none;
    }

    .app::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
    }

    header {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: center;
      margin-bottom: 28px;
    }

    .title-block h1 {
      font-size: clamp(2.3rem, 4.6vw, 5.2rem);
      line-height: .96;
      color: var(--text);
      font-weight: 850;
      letter-spacing: -0.055em;
      text-shadow: none;
      transform: none;
    }

    .title-block p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1.12rem;
      font-weight: 650;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      max-width: 720px;
    }

    .chip,
    .tool {
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.08);
      color: var(--text);
      border-radius: 14px;
      padding: 11px 14px;
      font-weight: 750;
      font-size: .96rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 26px rgba(0,0,0,.12);
      backdrop-filter: blur(16px);
      outline: none;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }

    button.tool,
    .close-btn,
    select.tool {
      cursor: pointer;
    }

    .tool:hover,
    .chip:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.12);
    }

    .tool:focus,
    .chip:focus,
    input:focus,
    select:focus,
    button:focus {
      outline: 3px solid rgba(96, 165, 250, .28);
      outline-offset: 2px;
    }

    .tool {
      min-width: 180px;
    }

    select.tool {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 50%,
        calc(100% - 12px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 34px;
    }

    select option {
      background: #111827;
      color: var(--text);
    }

    #searchInput {
      min-width: 270px;
    }

    #searchInput::placeholder {
      color: rgba(203, 213, 225, .68);
    }

    .legend {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      color: var(--muted);
      font-weight: 750;
      font-size: .98rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.06);
      padding: 8px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(255,255,255,.34);
      box-shadow: 0 0 18px currentColor;
    }

    .birthday-dot { background: var(--birthday); color: var(--birthday); }
    .anniversary-dot { background: var(--anniversary); color: var(--anniversary); }
    .db-dot { background: var(--db); color: var(--db); }
    .inazuma-dot { background: var(--inazuma); color: var(--inazuma); }
    .pokemon-dot { background: var(--pokemon); color: var(--pokemon); }

    .dashboard {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.05fr 1.4fr .95fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .today-card,
    .upcoming-card,
    .stats-card,
    .month {
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.055));
      border: 1px solid rgba(255,255,255,.13);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 44px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(22px) saturate(140%);
    }

    .today-card,
    .upcoming-card,
    .stats-card {
      padding: 18px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--text);
      font-weight: 850;
      font-size: 1.02rem;
    }

    .section-heading small {
      color: var(--muted-2);
      font-size: .78rem;
      font-weight: 700;
    }

    .today-title {
      font-size: 1.85rem;
      line-height: 1;
      margin-bottom: 8px;
      font-weight: 850;
      letter-spacing: -0.035em;
    }

    .today-date,
    .today-empty {
      color: var(--muted);
      font-weight: 650;
      line-height: 1.35;
    }

    .today-events,
    .upcoming-list {
      display: grid;
      gap: 9px;
    }

    .mini-event {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 1px solid rgba(255,255,255,.12);
      border-left: 5px solid var(--other);
      border-radius: 17px;
      padding: 10px;
      background: rgba(255,255,255,.065);
      color: var(--text);
      font-weight: 760;
      cursor: pointer;
      text-align: left;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }

    .mini-event:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.12);
      box-shadow: 0 12px 28px rgba(0,0,0,.20);
    }

    .mini-event.universe-dragonball { border-left-color: var(--db); }
    .mini-event.universe-inazuma { border-left-color: var(--inazuma); }
    .mini-event.universe-pokemon { border-left-color: var(--pokemon); }
    .mini-event.universe-other { border-left-color: var(--other); }

    .mini-event-avatar,
    .modal-avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--text);
      font-weight: 850;
      flex-shrink: 0;
    }

    .mini-event-avatar {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      font-size: .78rem;
    }

    .mini-event-avatar img,
    .modal-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mini-event-main {
      min-width: 0;
    }

    .mini-event-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mini-event-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
    }

    .countdown-pill,
    .pill {
      white-space: nowrap;
      border-radius: 999px;
      padding: 6px 9px;
      background: rgba(96,165,250,.13);
      color: #dbeafe;
      border: 1px solid rgba(96,165,250,.20);
      font-size: .78rem;
      font-weight: 800;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat-box {
      border-radius: 16px;
      padding: 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }

    .stat-box strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1;
      color: var(--text);
    }

    .stat-box span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-weight: 650;
      font-size: .82rem;
    }

    .view-controls {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .view-controls .chip {
      margin: 0;
    }

    .view-controls .tool {
      min-width: auto;
    }

    .months-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .months-grid.single-month {
      grid-template-columns: 1fr;
    }

    .month {
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .month::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--anniversary));
      opacity: .95;
    }

    .month::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 0%, rgba(255,255,255,.09), transparent 32%);
      pointer-events: none;
    }

    .month h2 {
      position: relative;
      z-index: 1;
      font-size: 1.6rem;
      margin: 2px 0 14px;
      color: var(--text);
      text-transform: capitalize;
      font-weight: 850;
      letter-spacing: -0.035em;
    }

    .weekdays,
    .days {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-auto-rows: 160px;
      gap: 9px;
    }

    .weekdays div {
      text-align: center;
      font-size: .82rem;
      color: var(--muted);
      font-weight: 800;
    }

    .day {
      width: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      border-radius: 16px;
      padding: 9px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
      position: relative;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease, border-color .15s ease;
      cursor: default;
      text-align: left;
      color: var(--text);
      min-height: 140px;
      overflow: hidden;
    }

    .day.has-events {
      cursor: pointer;
    }

    .day.has-events:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.18);
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
    }

    .day.empty {
      background: transparent;
      border-color: transparent;
      pointer-events: none;
    }

    .number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: start;
      min-width: 30px;
      height: 30px;
      padding: 0 8px;
      font-weight: 850;
      font-size: .96rem;
      border-radius: 999px;
      color: #dbeafe;
      background: rgba(255,255,255,.045);
    }

    .today .number {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 0 22px rgba(96,165,250,.42);
    }

    .events {
      margin-top: 6px;
      display: grid;
      gap: 5px;
      min-width: 0;
      max-height: calc(100% - 38px);
      overflow: hidden;
    }

    .event {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 5px;
      width: 100%;
      border-radius: 10px;
      padding: 6px 8px;
      text-align: left;
      font-size: .72rem;
      font-weight: 850;
      line-height: 1.05;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid rgba(255,255,255,.12);
      border-left: 5px solid var(--other);
      background: rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }

    .event-summary {
      justify-content: center;
      padding: 5px 10px;
      font-size: .72rem;
      color: #f8fafc;
      background: rgba(56,189,248,.22);
      border-left-color: rgba(56,189,248,.55);
      border-radius: 999px;
      border: 1px solid rgba(96,165,250,.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
      cursor: default;
    }

    .event-summary span {
      opacity: .95;
    }

    .event-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event.birthday {
      background: rgba(245,158,11,.22);
    }

    .event.anniversary {
      background: rgba(167,139,250,.24);
      color: white;
    }

    .event.universe-dragonball { border-left-color: var(--db); }
    .event.universe-inazuma { border-left-color: var(--inazuma); }
    .event.universe-pokemon { border-left-color: var(--pokemon); }
    .event.universe-other { border-left-color: var(--other); }

    .event.hidden-by-filter {
      display: none;
    }

    .universe-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 21px;
      height: 21px;
      border-radius: 7px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.14);
      font-size: .72rem;
      flex-shrink: 0;
    }

    .month.month-theme-0::before { background: linear-gradient(90deg, #7dd3fc, #bfdbfe, #f8fafc); }
    .month.month-theme-1::before { background: linear-gradient(90deg, #f472b6, #c084fc, #93c5fd); }
    .month.month-theme-2::before { background: linear-gradient(90deg, #86efac, #facc15, #fb7185); }
    .month.month-theme-3::before { background: linear-gradient(90deg, #a7f3d0, #60a5fa, #fef08a); }
    .month.month-theme-4::before { background: linear-gradient(90deg, #fbbf24, #fb7185, #34d399); }
    .month.month-theme-5::before { background: linear-gradient(90deg, #38bdf8, #fde047, #fb923c); }
    .month.month-theme-6::before { background: linear-gradient(90deg, #f97316, #ef4444, #facc15); }
    .month.month-theme-7::before { background: linear-gradient(90deg, #fb923c, #facc15, #f9a8d4); }
    .month.month-theme-8::before { background: linear-gradient(90deg, #f59e0b, #a3e635, #60a5fa); }
    .month.month-theme-9::before { background: linear-gradient(90deg, #7c3aed, #f97316, #111827); }
    .month.month-theme-10::before { background: linear-gradient(90deg, #64748b, #a855f7, #f59e0b); }
    .month.month-theme-11::before { background: linear-gradient(90deg, #ef4444, #22c55e, #f8fafc); }

    .event.priority-major,
    .modal-event.priority-major,
    .mini-event.priority-major {
      box-shadow: 0 0 0 1px rgba(255,217,131,.38), 0 0 24px rgba(245,158,11,.16);
    }

    .event.priority-major::after {
      content: "★";
      margin-left: 4px;
      color: #fde68a;
    }

    dialog {
      width: min(650px, calc(100vw - 32px));
      border: 0;
      border-radius: 28px;
      padding: 0;
      background: transparent;
      position: fixed;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      margin: 0;
    }

    dialog::backdrop {
      background: rgba(2, 6, 23, .58);
      backdrop-filter: blur(12px);
    }

    .modal-card {
      background: linear-gradient(145deg, rgba(30,41,59,.94), rgba(15,23,42,.88));
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 30px 90px rgba(0,0,0,.50), inset 0 1px 0 rgba(255,255,255,.10);
      color: var(--text);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(30px) saturate(150%);
    }

    .modal-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(96,165,250,.24), transparent 35%);
      pointer-events: none;
    }

    .modal-card > * {
      position: relative;
      z-index: 1;
    }

    .modal-card h3 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .modal-date {
      font-weight: 750;
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 1.05rem;
    }

    .modal-list {
      display: grid;
      gap: 12px;
    }

    .modal-event {
      border-radius: 20px;
      padding: 15px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      border-left: 7px solid var(--other);
    }

    .modal-event.universe-dragonball { border-left-color: var(--db); }
    .modal-event.universe-inazuma { border-left-color: var(--inazuma); }
    .modal-event.universe-pokemon { border-left-color: var(--pokemon); }
    .modal-event.universe-other { border-left-color: var(--other); }

    .modal-event-header {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 14px;
      align-items: center;
      margin-bottom: 10px;
    }

    .modal-avatar {
      width: 78px;
      height: 78px;
      border-radius: 19px;
      font-size: 1.1rem;
    }

    .modal-event strong {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.22rem;
      margin-bottom: 3px;
    }

    .modal-event p {
      color: var(--muted);
      font-weight: 650;
      font-size: .98rem;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .close-btn {
      margin-top: 22px;
      width: 100%;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      padding: 14px 18px;
      background: linear-gradient(135deg, rgba(96,165,250,.92), rgba(34,211,238,.80));
      color: white;
      font-size: 1rem;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(37,99,235,.22);
      transition: transform .16s ease, filter .16s ease;
    }

    .close-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .ambient-toggle.active {
      background: rgba(96,165,250,.20);
      border-color: rgba(96,165,250,.38);
      color: #dbeafe;
    }

    @keyframes softPop {
      from { opacity: 0; transform: translate(-50%, -47%) scale(.96); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    dialog[open] {
      animation: softPop .18s ease-out both;
    }

    .footer-note {
      position: relative;
      z-index: 1;
      margin-top: 28px;
      color: var(--muted);
      font-weight: 650;
      text-align: center;
      font-size: .98rem;
    }

    .footer-note strong {
      color: #dbeafe;
    }

    @media (max-width: 1360px) {
      .months-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      body {
        padding: 14px;
      }

      .app {
        padding: 24px;
        border-radius: 26px;
      }

      header {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .view-controls {
        justify-content: space-between;
        flex-wrap: wrap;

      }

        grid-template-columns: 1fr;
      }

        min-width: 100%;
        width: 100%;
      }

      .dashboard {
        grid-template-columns: 1fr;
      }

      .month {
        padding: 18px;
      }

      .weekdays,
      .days {
        grid-auto-rows: 130px;
        gap: 8px;
      }

      .day {
        min-height: 130px;
        padding: 8px;
      }

      .number {
        min-width: 28px;
        height: 28px;
        font-size: .92rem;
      }

      .events {
        max-height: calc(100% - 38px);
        overflow: hidden;
      }

      .event {
        font-size: .68rem;
        padding: 4px 6px;
      }

      .event-summary {
        font-size: .7rem;
        padding: 5px 7px;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
      }

      .app {
        padding: 18px;
        border-radius: 20px;
      }

      .toolbar,
      .view-controls {
        gap: 10px;
      }

      .months-grid {
        grid-template-columns: 1fr;
      }

      .day {
        min-height: 140px;
      }

      .title-block h1 {
        font-size: 2.4rem;
      }

      .title-block p,
      .legend,
      .close-btn,
      .chip,
      .tool {
        font-size: .92rem;
      }

      .modal-card {
        padding: 22px;
      }

      .event {
        grid-template-columns: auto 1fr;
        gap: 4px;
        white-space: normal;
      }

      .events {
        max-height: calc(100% - 38px);
      }

      .event-summary {
        font-size: .74rem;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .mini-event {
        grid-template-columns: auto 1fr;
      }

      .countdown-pill {
        grid-column: 1 / -1;
        justify-self: start;
      }

      .modal-event-header {
        grid-template-columns: 1fr;
      }

      .modal-avatar {
        width: 96px;
        height: 96px;
      }
    }

  <main class="app">
    <header>
      <div class="title-block">
        <h1>Calendario de Recuerdos</h1>
        <p>Cumpleaños, aniversarios y fechas importantes de todo el año.</p>
      </div>

      <div class="toolbar">
        <span class="chip" id="yearLabel"></span>

        <select class="tool" id="typeFilter" aria-label="Filtrar por tipo de evento">
          <option value="all">Todo</option>
          <option value="birthday">Cumpleaños</option>
          <option value="anniversary">Aniversarios</option>
        </select>

        <select class="tool" id="universeFilter" aria-label="Filtrar por universo">
          <option value="all">Todos los universos</option>

          <option value="inazuma">Inazuma Eleven</option>
          <option value="pokemon">Pokémon</option>
          <option value="other">Otros</option>
        </select>

        <input class="tool" id="searchInput" type="search" placeholder="Buscar personaje, nota, universo..." />

        <select class="tool" id="nostalgiaFilter" aria-label="Filtrar por estado del personaje">
          <option value="all">Todos los estados</option>
          <option value="active">Activos</option>
          <option value="deceased">Fallecidos</option>
          <option value="retired">Retirados</option>
          <option value="old">Antiguos</option>
        </select>

        <button class="tool ambient-toggle" id="ambientToggle" type="button">🎵 Ambiente OFF</button>
      </div>
    </header>

    <section class="legend" aria-label="Leyenda">
      <span><i class="dot birthday-dot"></i> Cumpleaños</span>
      <span><i class="dot anniversary-dot"></i> Aniversario</span>
      <span><i class="dot db-dot"></i> Dragon Ball</span>
      <span><i class="dot inazuma-dot"></i> Inazuma</span>
      <span><i class="dot pokemon-dot"></i> Pokémon</span>
      <span><i class="dot" style="background:#2f2a24"></i> Hoy</span>
    </section>

    <section class="dashboard" aria-label="Resumen del calendario">
      <article class="today-card" id="todayCard"></article>
      <article class="upcoming-card">
        <div class="section-heading">
          <span>🎂 Próximos recuerdos</span>
          <small>ordenados desde hoy</small>
        </div>
        <div class="upcoming-list" id="upcomingList"></div>
      </article>
      <article class="stats-card">
        <div class="section-heading">
          <span>📊 Estadísticas</span>
          <small>del calendario</small>
        </div>
        <div class="stats-grid" id="statsGrid"></div>
      </article>
    </section>

    <div class="view-controls">
      <button class="tool" id="viewModeButton" type="button">Vista mes</button>
      <button class="tool" id="prevMonth" type="button">Anterior</button>
      <span class="chip" id="activeMonthLabel"></span>
      <button class="tool" id="nextMonth" type="button">Siguiente</button>
    </div>

    <section class="months-grid" id="calendar" aria-label="Calendario anual"></section>

    <p class="footer-note">
      Edita el array <strong>EVENTOS</strong> del JavaScript para añadir tus fechas desde el código.
    </p>
  </main>

    function normalizeText(text) {
      return String(text)
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function getTypeInfo(type) {
      return TYPE_INFO[type] || TYPE_INFO.birthday;
    }

    function getUniverseInfo(universe) {
      return UNIVERSE_INFO[universe] || UNIVERSE_INFO.other;
    }



    function getStatusInfo(status) {
      return STATUS_INFO[status || 'active'] || STATUS_INFO.active;
    }

    function getEventInitials(name) {
      return String(name)
        .split(/\s+|&/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part.charAt(0).toUpperCase())
        .join('');
    }

    function avatarHTML(event, className) {
      if (event.image || event.img || event.photo) {
        const src = event.image || event.img || event.photo;
        return `<span class="${className}"><img src="${src}" alt="${event.name}"></span>`;
      }
      return `<span class="${className}">${getEventInitials(event.name)}</span>`;
    }

    function getDateForEvent(event, year = CURRENT_YEAR) {
      return new Date(year, event.month - 1, event.day);
    }

    function daysUntilEvent(event) {
      const today = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
      let date = getDateForEvent(event, TODAY.getFullYear());
      if (date < today) date = getDateForEvent(event, TODAY.getFullYear() + 1);
      return Math.round((date - today) / 86400000);
    }

    function countdownText(days) {
      if (days === 0) return 'Hoy';
      if (days === 1) return 'Mañana';
      return `Faltan ${days} días`;

      const typeInfo = getTypeInfo(event.type);
      const statusInfo = getStatusInfo(event.status);

      const typeMatches = selectedType === 'all' || event.type === selectedType;
      const universeMatches = selectedUniverse === 'all' || event.universe === selectedUniverse;
      const statusMatches = selectedStatus === 'all' || (event.status || 'active') === selectedStatus;
      const searchableText = `${event.name} ${event.note || ''} ${event.universe || ''} ${universeInfo.label} ${event.type || ''} ${typeInfo.label} ${event.tags || ''} ${event.status || 'active'} ${statusInfo.label}`;
      const searchMatches = !search || normalizeText(searchableText).includes(search);

      return typeMatches && universeMatches && statusMatches && searchMatches;
    }

    function openDayModal(day, month, events) {
      const visibleEvents = events.filter(eventMatchesFilters);
      if (!visibleEvents.length) return;

      modalTitle.textContent = `${day} de ${MONTHS[month - 1]}`;
      modalDate.textContent = `${visibleEvents.length} recuerdo${visibleEvents.length === 1 ? '' : 's'} apuntado${visibleEvents.length === 1 ? '' : 's'}`;
      modalList.innerHTML = '';

      visibleEvents.forEach(event => {
        const typeInfo = getTypeInfo(event.type);
        const universeInfo = getUniverseInfo(event.universe);

        const statusInfo = getStatusInfo(event.status);
        const days = daysUntilEvent(event);
        const article = document.createElement('article');
        article.className = `modal-event ${universeInfo.className} ${event.priority === 'major' ? 'priority-major' : ''}`;
        article.innerHTML = `
          <div class="modal-event-header">
            ${avatarHTML(event, 'modal-avatar')}
            <div>
              <strong>
                <span>${typeInfo.icon}</span>
                <span>${event.name}</span>
              </strong>
              <p>${event.note || 'Sin nota añadida.'}</p>
            </div>
          </div>

          <div class="meta-row">
            <span class="pill">${typeInfo.icon} ${typeInfo.label}</span>
            <span class="pill">${universeInfo.icon} ${universeInfo.label}</span>
            <span class="pill">⏳ ${countdownText(days)}</span>
            <span class="pill">${statusInfo.icon} ${statusInfo.label}</span>
            ${event.priority === 'major' ? '<span class="pill">⭐ Importante</span>' : ''}
          </div>
        `;

        modalList.appendChild(article);
      });

      modal.showModal();
    }

    function createMonth(monthIndex) {
      const monthNumber = monthIndex + 1;
      const firstDate = new Date(CURRENT_YEAR, monthIndex, 1);
      const totalDays = new Date(CURRENT_YEAR, monthIndex + 1, 0).getDate();

      // JS empieza la semana en domingo. Lo convertimos para que lunes sea 0.
      const startOffset = (firstDate.getDay() + 6) % 7;

      const monthCard = document.createElement('article');
      monthCard.className = `month month-theme-${monthIndex}`;

      const title = document.createElement('h2');
      title.textContent = MONTHS[monthIndex];
      monthCard.appendChild(title);

      const weekdayRow = document.createElement('div');
      weekdayRow.className = 'weekdays';

      WEEKDAYS.forEach(day => {
        const cell = document.createElement('div');
        cell.textContent = day;
        weekdayRow.appendChild(cell);
      });

      monthCard.appendChild(weekdayRow);

      const daysGrid = document.createElement('div');
      daysGrid.className = 'days';

      for (let i = 0; i < startOffset; i++) {
        const empty = document.createElement('div');
        empty.className = 'day empty';
        daysGrid.appendChild(empty);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dayCell = document.createElement('button');
        dayCell.className = 'day';
        dayCell.type = 'button';

        const isToday =
          TODAY.getFullYear() === CURRENT_YEAR &&
          TODAY.getMonth() === monthIndex &&
          TODAY.getDate() === day;

        if (isToday) dayCell.classList.add('today');

        const number = document.createElement('span');
        number.className = 'number';
        number.textContent = day;
        dayCell.appendChild(number);

        const events = getEventsForDay(day, monthNumber);

        if (events.length) {
          dayCell.classList.add('has-events');

          const eventBox = document.createElement('div');
          eventBox.className = 'events';

          const maxVisibleEvents = 2;
          const visibleEvents = events.slice(0, maxVisibleEvents);
          const hiddenCount = Math.max(0, events.length - visibleEvents.length);

          visibleEvents.forEach(event => {
            const typeInfo = getTypeInfo(event.type);
            const universeInfo = getUniverseInfo(event.universe);

            const eventLabel = document.createElement('span');
            eventLabel.className = `event ${event.type} ${universeInfo.className} ${event.priority === 'major' ? 'priority-major' : ''}`;
            eventLabel.dataset.type = event.type;
            eventLabel.dataset.universe = event.universe;
            eventLabel.dataset.status = event.status || 'active';
            eventLabel.dataset.name = event.name;
            eventLabel.dataset.note = event.note || '';
            eventLabel.dataset.tags = event.tags || '';

            eventLabel.innerHTML = `
              <span class="universe-badge" title="${universeInfo.label}">${universeInfo.icon}</span>
              <span class="event-name">${typeInfo.icon} ${event.name}</span>
            `;

            eventBox.appendChild(eventLabel);
          });

          if (hiddenCount > 0) {
            const summary = document.createElement('span');
            summary.className = 'event event-summary';
            summary.innerHTML = `<span>+${hiddenCount} más</span>`;
            eventBox.appendChild(summary);
          }

          dayCell.appendChild(eventBox);
          dayCell.addEventListener('click', () => openDayModal(day, monthNumber, events));
        }

        daysGrid.appendChild(dayCell);
      }

      monthCard.appendChild(daysGrid);
      return monthCard;
    }

    const mobileMediaQuery = window.matchMedia('(max-width: 980px)');
    let viewMode = mobileMediaQuery.matches ? 'month' : 'all';
    let activeMonthIndex = TODAY.getMonth();

    function updateMonthControls() {
      activeMonthLabel.textContent = MONTHS[activeMonthIndex].charAt(0).toUpperCase() + MONTHS[activeMonthIndex].slice(1);
      const isMonthView = viewMode === 'month';
      calendar.classList.toggle('single-month', isMonthView);
      Array.from(calendar.children).forEach((monthCard, index) => {
        monthCard.hidden = isMonthView && index !== activeMonthIndex;
      });
      viewModeButton.textContent = isMonthView ? 'Vista anual' : 'Vista mes';
      prevMonth.style.display = isMonthView ? 'inline-flex' : 'none';
      nextMonth.style.display = isMonthView ? 'inline-flex' : 'none';
      activeMonthLabel.style.display = isMonthView ? 'inline-flex' : 'none';
    }

    function syncResponsiveViewMode() {
      const mobile = mobileMediaQuery.matches;
      if (mobile && viewMode === 'all') viewMode = 'month';
      if (!mobile && viewMode === 'month') viewMode = 'all';
      updateMonthControls();
    }

    function changeMonth(offset) {
      activeMonthIndex = (activeMonthIndex + offset + 12) % 12;
      updateMonthControls();
    }



    function makeMiniEvent(event) {
      const typeInfo = getTypeInfo(event.type);
      const universeInfo = getUniverseInfo(event.universe);
      const days = daysUntilEvent(event);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `mini-event ${universeInfo.className} ${event.priority === 'major' ? 'priority-major' : ''}`;
      button.innerHTML = `
        ${avatarHTML(event, 'mini-event-avatar')}
        <span class="mini-event-main">
          <span class="mini-event-name">${typeInfo.icon} ${event.name}</span>
          <span class="mini-event-meta">${formatEventDate(event)} · ${universeInfo.icon} ${universeInfo.label}</span>
        </span>
        <span class="countdown-pill">${countdownText(days)}</span>
      `;
      button.addEventListener('click', () => {
        activeMonthIndex = event.month - 1;
        viewMode = 'month';
        updateMonthControls();
        openDayModal(event.day, event.month, getEventsForDay(event.day, event.month));
      });
      return button;
    }

    function renderTodayCard() {
      const todayEvents = getEventsForDay(TODAY.getDate(), TODAY.getMonth() + 1).filter(eventMatchesFilters);
      todayCard.innerHTML = `
        <div class="today-title">📌 Hoy · ${TODAY.getDate()} de ${MONTHS[TODAY.getMonth()]}</div>
      `;

      if (!todayEvents.length) {
        const empty = document.createElement('p');
        empty.className = 'today-empty';
        empty.textContent = 'Hoy no hay recuerdos visibles con los filtros actuales.';
        todayCard.appendChild(empty);
        return;
      }

      const list = document.createElement('div');
      list.className = 'today-events';
      todayEvents.forEach(event => list.appendChild(makeMiniEvent(event)));
      todayCard.appendChild(list);
    }

    function renderUpcoming() {
      const upcoming = EVENTOS
        .filter(eventMatchesFilters)
        .map(event => ({ event, days: daysUntilEvent(event) }))
        .sort((a, b) => a.days - b.days || a.event.month - b.event.month || a.event.day - b.event.day || a.event.name.localeCompare(b.event.name))
        .slice(0, 6);

      upcomingList.innerHTML = '';

      if (!upcoming.length) {
        upcomingList.innerHTML = '<p class="today-empty">No hay próximos recuerdos con estos filtros.</p>';
        return;
      }

      upcoming.forEach(({ event }) => upcomingList.appendChild(makeMiniEvent(event)));
    }

    function renderStats() {
      const visible = EVENTOS.filter(eventMatchesFilters);
      const birthdayCount = visible.filter(event => event.type === 'birthday').length;
      const anniversaryCount = visible.filter(event => event.type === 'anniversary').length;
      const monthCounts = MONTHS.map((_, index) => visible.filter(event => event.month === index + 1).length);
      const maxMonthIndex = monthCounts.indexOf(Math.max(...monthCounts));
      const universeCounts = visible.reduce((acc, event) => {
        acc[event.universe] = (acc[event.universe] || 0) + 1;
        return acc;
      }, {});
      const topUniverse = Object.entries(universeCounts).sort((a, b) => b[1] - a[1])[0];
      const topUniverseText = topUniverse ? `${getUniverseInfo(topUniverse[0]).label}: ${topUniverse[1]}` : 'Sin datos';

      statsGrid.innerHTML = `
        <div class="stat-box"><strong>${visible.length}</strong><span>recuerdos visibles</span></div>
        <div class="stat-box"><strong>${birthdayCount}</strong><span>cumpleaños</span></div>
        <div class="stat-box"><strong>${anniversaryCount}</strong><span>aniversarios</span></div>
        <div class="stat-box"><strong>${MONTHS[maxMonthIndex] || '-'}</strong><span>mes con más eventos</span></div>
        <div class="stat-box"><strong>${topUniverseText}</strong><span>universo dominante</span></div>
        <div class="stat-box"><strong>${EVENTOS.filter(event => event.priority === 'major').length}</strong><span>eventos importantes</span></div>
      `;
    }

    function renderDashboard() {
      renderTodayCard();
      renderUpcoming();
      renderStats();
    }

    let ambientContext;
    let ambientNodes = [];
    let ambientOn = false;

    function stopAmbient() {
      ambientNodes.forEach(node => {
        try { node.stop && node.stop(); } catch (error) {}
        try { node.disconnect && node.disconnect(); } catch (error) {}
      });
      ambientNodes = [];
      ambientOn = false;
      ambientToggle.classList.remove('active');
      ambientToggle.textContent = '🎵 Ambiente OFF';
    }

    async function toggleAmbient() {
      if (ambientOn) {
        stopAmbient();
        return;
      }

      ambientContext = ambientContext || new (window.AudioContext || window.webkitAudioContext)();
      if (ambientContext.state === 'suspended') await ambientContext.resume();

      const master = ambientContext.createGain();
      master.gain.value = 0.035;
      master.connect(ambientContext.destination);
      ambientNodes.push(master);

      [196, 246.94, 293.66].forEach((freq, index) => {
        const osc = ambientContext.createOscillator();
        const gain = ambientContext.createGain();
        osc.type = index === 0 ? 'sine' : 'triangle';
        osc.frequency.value = freq;
        gain.gain.value = index === 0 ? 0.45 : 0.22;
        osc.connect(gain);
        gain.connect(master);
        osc.start();
        ambientNodes.push(osc, gain);
      });

      ambientOn = true;
      ambientToggle.classList.add('active');
      ambientToggle.textContent = '🎵 Ambiente ON';
    }
    function renderCalendar() {
      calendar.innerHTML = '';
      MONTHS.forEach((_, index) => calendar.appendChild(createMonth(index)));
      applyFilters();
      updateMonthControls();
    }

    window.addEventListener('resize', syncResponsiveViewMode);
    if (mobileMediaQuery.addEventListener) {
      mobileMediaQuery.addEventListener('change', syncResponsiveViewMode);
    } else if (mobileMediaQuery.addListener) {
      mobileMediaQuery.addListener(syncResponsiveViewMode);
    }

    function applyFilters() {
      const selectedType = typeFilter.value;
      const selectedUniverse = universeFilter.value;
      const selectedStatus = nostalgiaFilter.value;
      const search = normalizeText(searchInput.value.trim());

      document.querySelectorAll('.event').forEach(eventElement => {
        const type = eventElement.dataset.type;
        const universe = eventElement.dataset.universe;
        const status = eventElement.dataset.status || 'active';
        const universeInfo = getUniverseInfo(universe);
        const typeInfo = getTypeInfo(type);
        const statusInfo = getStatusInfo(status);
        const text = normalizeText(`${eventElement.dataset.name} ${eventElement.dataset.note} ${eventElement.dataset.tags} ${universe} ${universeInfo.label} ${type} ${typeInfo.label} ${status} ${statusInfo.label}`);

        const typeMatches = selectedType === 'all' || type === selectedType;
        const universeMatches = selectedUniverse === 'all' || universe === selectedUniverse;
        const statusMatches = selectedStatus === 'all' || status === selectedStatus;
        const searchMatches = !search || text.includes(search);

        eventElement.classList.toggle('hidden-by-filter', !(typeMatches && universeMatches && statusMatches && searchMatches));
      });

      renderDashboard();
    }

    typeFilter.addEventListener('change', applyFilters);
    universeFilter.addEventListener('change', applyFilters);
    nostalgiaFilter.addEventListener('change', applyFilters);
    searchInput.addEventListener('input', applyFilters);
    ambientToggle.addEventListener('click', toggleAmbient);
    viewModeButton.addEventListener('click', () => {
      viewMode = viewMode === 'all' ? 'month' : 'all';
      updateMonthControls();
    });
    prevMonth.addEventListener('click', () => changeMonth(-1));
    nextMonth.addEventListener('click', () => changeMonth(1));

    closeModal.addEventListener('click', () => modal.close());

    modal.addEventListener('click', event => {
      const modalCard = event.target.closest('.modal-card');
      if (!modalCard) modal.close();
    });

    renderCalendar();
    setTimeout(() => {
      const todayCell = document.querySelector('.day.today');
      if (todayCell && viewMode === 'all') todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  </script>
</body>
</html>
