<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo de STs</title>
  <link rel="stylesheet" href="sts.css">
</head>
<body>
  <main class="pantalla-select">
    <header class="titulo">
      <div class="marca-superior">INAZUMA DATABASE</div>
      <h1>ARCHIVO DE STs</h1>
      <p>Selector de jugadores · Supertécnicas · EG · Miximax</p>
    </header>

    <section class="zona-principal">
      <aside class="panel-selector">
        <div class="buscador-box">
          <label for="buscador-personajes">Buscar jugador</label>
          <input id="buscador-personajes" type="search" placeholder="Ej: Ren, Fuego, Raimon, Portero...">
        </div>

        <div class="filtros-panel" id="filtros-panel">
          <div class="filtros-top">
            <button id="toggle-filtros" class="toggle-filtros" type="button" aria-expanded="false" aria-controls="filtros-contenido">
              ⚙️ Filtros
            </button>
            <button id="limpiar-filtros" type="button">Limpiar</button>
          </div>

          <div class="filtros-contenido" id="filtros-contenido">
            <div class="filtros-grid">
            <label>
              Afinidad
              <select id="filtro-afinidad"></select>
            </label>

            <label>
              Posición
              <select id="filtro-posicion"></select>
            </label>

            <label>
              Equipo
              <select id="filtro-equipo"></select>
            </label>

            <label>
              Tipo ST
              <select id="filtro-tipo"></select>
            </label>
            </div>

            <div class="filtros-especiales" aria-label="Filtros especiales">
            <button class="filtro-chip" type="button" data-especial="eg">EG</button>
            <button class="filtro-chip" type="button" data-especial="armadura">Armadura</button>
            <button class="filtro-chip" type="button" data-especial="miximax">Miximax</button>
            <button class="filtro-chip" type="button" data-especial="combinada">Combinadas</button>
            </div>
          </div>
        </div>

        <div class="selector-header">
          <strong>Plantilla</strong>
          <span id="contador-personajes"></span>
        </div>

        <div id="selector-personajes" class="selector-personajes"></div>
      </aside>

      <section id="ficha-personaje" class="ficha-personaje"></section>
    </section>
  </main>

  <script src="sts.js"></script>
</body>
</html>
